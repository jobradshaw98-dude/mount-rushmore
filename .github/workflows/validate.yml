# Checks a change to topics before it can merge: the research files build into valid rows, no playable day
# changes, and the database rules still refuse edits, deletes, backdated rows and non-publisher writes.
name: validate topics
on:
  pull_request:
    paths: ["research/**", "tools/**", "game.js", "database.rules.json", "package.json", ".github/workflows/**"]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - name: What would be published (reads the live catalog)
        run: node tools/catalog.js plan
      - name: Database rules
        run: npm run test:rules
