<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mount Rushmore Daily</title>
<meta name="description" content="A daily snake-draft game. Draft your Mount Rushmore of today's topic with 2-4 friends, then see whose mountain stands tallest.">
<meta property="og:title" content="Mount Rushmore Daily">
<meta property="og:description" content="Draft your Mount Rushmore of today's topic with 2-4 friends.">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rushmore">

<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#EEF5FA; --sky2:#DCEAF4; --card:#FFFFFF; --ink:#1F2630; --muted:#5F6B78; --line:#D7E0E8;
  --rock:#7D8894; --rock-hi:#A9B3BD; --rock-lo:#4E5864; --face:#D5DADF;
  --gold:#E58B2A; --gold-soft:#FDE7CC; --pine:#1F8A6B; --flag:#D9533F;
  --coral:#EE6A55; --teal:#1C8C8C; --teal-soft:#DDF3F1; --plum:#6B52B0; --plum-soft:#ECE7FA; --sun-soft:#FFF1DD;
  --bg-top:#CFE5F6; --bg-mid:#F3E6DC; --bg-bot:#FBE3D2;
  --hero-a:#FFC46B; --hero-b:#F58A5B; --hero-c:#8FB3DF;
  --p0:#1F9E6E; --p1:#E58B2A; --p2:#E35A45; --p3:#3F7FD6;
  --t1:#2F7A56; --t2:#B98A16; --t3:#C0652E; --t4:#8E98A2;
  --display:"Alfa Slab One", "Rockwell", "Roboto Slab", Georgia, serif;
  --body:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"DM Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --sky:#101722; --sky2:#1A2433; --card:#1B2532; --ink:#EAF0F5; --muted:#9AA8B6; --line:#2D3A4A;
    --rock:#556273; --rock-hi:#71808F; --rock-lo:#394452; --face:#8894A1;
    --gold:#F2A64B; --gold-soft:#3D2D18; --pine:#4CC392; --flag:#F07A62;
    --coral:#F07A62; --teal:#43C0BA; --teal-soft:#15333A; --plum:#A48CF0; --plum-soft:#272345; --sun-soft:#33291B;
    --bg-top:#0F1A2B; --bg-mid:#161B2A; --bg-bot:#1F1A24;
    --hero-a:#B8622E; --hero-b:#7C3C52; --hero-c:#253E66;
    --p0:#4CC392; --p1:#F2A64B; --p2:#F07A62; --p3:#6FA2EE;
    --t1:#5DB08A; --t2:#E0B53E; --t3:#E58A52; --t4:#7C8894;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 55%,var(--bg-bot) 100%) var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{white-space:nowrap;flex:none;min-width:0;display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:18px;letter-spacing:.3px;text-decoration:none;color:var(--ink);background:none;border:0;padding:0;cursor:pointer}
.brand svg{width:34px;height:22px}
.conn{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;font-family:var(--mono)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rock)}
.dot.live{background:var(--pine)} .dot.bad{background:var(--flag)}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
.display{font-family:var(--display);font-weight:400;letter-spacing:.2px;line-height:1.02}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(31,38,48,.05),0 6px 18px rgba(31,38,48,.06)}
.tint-teal{background:var(--teal-soft);border-color:transparent}.tint-plum{background:var(--plum-soft);border-color:transparent}.tint-gold{background:var(--sun-soft);border-color:transparent}
.tint-teal .eyebrow{color:var(--teal)}.tint-plum .eyebrow{color:var(--plum)}.tint-gold .eyebrow{color:var(--gold)}
/* hero */
.hero{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,var(--hero-c) 0%,var(--hero-b) 55%,var(--hero-a) 100%);border:0;box-shadow:0 8px 24px rgba(229,139,42,.25)}
.hero .copy{background:var(--card)}
.hero svg.mtn{display:block;width:100%;height:auto}
.hero .copy{padding:4px 20px 22px;display:flex;flex-direction:column;gap:6px}
.topic{font-size:clamp(34px,8vw,56px)}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
/* buttons */
.btn{appearance:none;border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--sky);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;transition:transform .08s ease, opacity .15s}
.btn:active{transform:translateY(1px)}
.btn.gold{background:var(--gold);color:#1E1608}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{min-height:36px;padding:7px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input.t{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--sky);font-size:17px;min-height:48px}
input.t:focus{border-color:var(--gold);outline:none}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sky)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0;padding:0;list-style:none}
.steps li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px}
.steps b{display:block;font-family:var(--display);font-weight:400;font-size:15px;margin-bottom:2px}
.steps li:nth-child(1) b{color:var(--p0)}.steps li:nth-child(2) b{color:var(--gold)}.steps li:nth-child(3) b{color:var(--p3)}
@media (max-width:560px){.steps{grid-template-columns:1fr}}
@media (max-width:420px){.top.compact .brand .bt{display:none}}
/* lobby */
.invite{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.code{font-family:var(--mono);font-size:30px;letter-spacing:.18em;background:var(--gold-soft);border-radius:12px;padding:8px 14px}
.linkbox{flex:1 1 220px;min-width:0;font-family:var(--mono);font-size:13px;background:var(--sky);border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:all}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;min-width:0}
.pl span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl.empty{border-style:dashed;color:var(--muted);font-weight:400}
.chip{width:12px;height:12px;border-radius:4px;flex:none}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:99px;background:var(--sky2);color:var(--muted)}
/* draft */
.clock{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:14px;background:var(--card);border:1.5px solid var(--line)}
.clock.mine{border-color:transparent;background:linear-gradient(135deg,var(--sun-soft),var(--gold-soft));box-shadow:0 0 0 3px var(--gold)}
.clock.mine .who{color:var(--ink)}
.clock .who{font-family:var(--display);font-size:24px}
.snake{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
@media (hover:none){.snake::-webkit-scrollbar{display:none}}
@media (hover:hover){.snake{scrollbar-width:thin}}
.snake .s{flex:none;font-size:12px;padding:5px 9px;border-radius:99px;border:1.5px solid var(--line);white-space:nowrap;display:flex;gap:6px;align-items:center}
.snake .s.now{background:var(--ink);color:var(--sky);border-color:var(--ink)}
.snake .s.turn{border-style:dashed}
.pickbox{position:relative}
.sug{list-style:none;margin:6px 0 0;padding:6px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);display:flex;flex-direction:column;gap:2px}
.sug:empty{display:none}
.sug button{width:100%;text-align:left;background:transparent;border:0;padding:10px 10px;border-radius:8px;cursor:pointer;font-size:16px}
.sug button[aria-selected="true"],.sug button:hover{background:var(--sky2)}
.hint{font-size:13px;min-height:18px;color:var(--muted)}
.hint b{color:var(--ink)}
.board{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:10px}
@media (max-width:560px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
.col{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.col.onclock{border-color:var(--gold)}
.col h3{font-size:15px;display:flex;gap:7px;align-items:center;min-width:0}
.col h3 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot{display:flex;gap:8px;align-items:baseline;padding:8px;border-radius:9px;background:color-mix(in srgb,var(--pc,var(--rock)) 16%,var(--card));font-weight:600;font-size:14px;min-height:38px;min-width:0}
.slot .i{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none}
.slot .l{overflow-wrap:anywhere}
.slot.empty{background:transparent;border:1.5px dashed var(--line);color:var(--muted);font-weight:400}
.slot.fresh{animation:carve .7s cubic-bezier(.2,.8,.2,1)}
@keyframes carve{0%{transform:scale(.92);background:var(--gold-soft)}60%{background:var(--gold-soft)}100%{transform:none}}
.err{color:var(--flag);font-size:14px;font-weight:600}
/* order */
.olist{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.olist li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--card);border:1.5px solid var(--line)}
.olist .spot{font-family:var(--mono);font-size:11px;color:var(--muted);width:92px;flex:none;line-height:1.2}
.olist .nm{flex:1;font-weight:700;min-width:0;overflow-wrap:anywhere}
.arrows{display:flex;gap:6px}
.arrows button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--sky);cursor:pointer;font-size:16px}
.arrows button[disabled]{opacity:.3;cursor:default}
/* results */
.winner{text-align:center;padding:22px 16px;background:linear-gradient(160deg,var(--sun-soft),var(--gold-soft));border-color:transparent}
.winner .display{font-size:clamp(28px,7vw,44px)}
.res{display:flex;flex-direction:column;gap:12px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rcard .head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 4px}
.rcard .head h3{font-family:var(--display);font-weight:400;font-size:22px;display:flex;gap:10px;align-items:center;min-width:0}
.place{font-family:var(--mono);font-size:13px;color:var(--muted)}
.total{font-family:var(--display);font-size:34px;line-height:1}
.total small{font-family:var(--mono);font-size:12px;color:var(--muted)}
.rcard svg.mtn{display:block;width:100%;height:auto;max-height:170px}
.faces{width:100%;border-collapse:collapse;font-size:14px}
.faces td{padding:9px 16px;border-top:1px solid var(--line);vertical-align:top}
.faces td.pts{text-align:right;font-family:var(--mono);white-space:nowrap}
.faces .fn{font-weight:700}
.faces .sub{font-size:12px;color:var(--muted)}
.tier{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.bonus{font-size:11px;font-weight:700;color:var(--pine);margin-left:6px;white-space:nowrap}
details.cons{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
details.cons summary{cursor:pointer;font-weight:700}
details.cons ol{margin:10px 0 0;padding-left:26px;columns:2;column-gap:28px;font-size:14px}
@media (max-width:480px){details.cons ol{columns:1}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sky);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
.recent{display:flex;flex-direction:column;gap:6px;font-size:14px}
.recent a{color:var(--ink)}
textarea.share{width:100%;min-height:150px;font-family:var(--mono);font-size:13px;border-radius:12px;border:1.5px solid var(--line);background:var(--sky);padding:10px}
.guide-back{position:fixed;inset:0;background:rgba(16,22,29,.55);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.guide{background:var(--card);color:var(--ink);border-radius:20px;max-width:540px;width:100%;margin:auto 0;padding:22px 20px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.guide h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05}
.guide .step{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.guide .num{font-family:var(--display);font-size:22px;width:40px;height:40px;border-radius:12px;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center}
.guide .step b{display:block;font-size:16px;margin-bottom:2px}
.guide .step p{margin:0;font-size:14px;color:var(--muted)}
.snakedemo{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-family:var(--mono);font-size:12px}
.snakedemo div{display:flex;gap:4px;align-items:center}
.snakedemo span.c{width:24px;height:24px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.spotrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.spotrow span{font-size:11px;text-align:center;padding:6px 2px;border-radius:8px;background:var(--sky);font-weight:600;line-height:1.2}
.helpbtn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:transparent;font-weight:800;cursor:pointer;flex:none}
.ig-icon{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;background:var(--sky2);color:#0A6CF0;flex:none}
.ig-step{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.ig-arrow{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:21;color:#fff;font-weight:800;font-size:14px;text-align:center;animation:bob 1s ease-in-out infinite;text-shadow:0 1px 4px rgba(0,0,0,.5)}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}
.streak{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:linear-gradient(135deg,var(--gold),var(--coral));color:#fff;font-weight:800;font-size:13px}
.playrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.crewrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.crewchip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;line-height:1.25}
.crewchip b{font-size:15px}.crewchip .mono{font-size:10px;letter-spacing:.1em;opacity:.6}
.crewchip.yours{border-color:var(--gold);background:var(--gold-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 30%,transparent);animation:yourturn 1.6s ease-in-out infinite}
.crewchip .yourmove{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
@keyframes yourturn{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--gold) 12%,transparent)}}
@media (prefers-reduced-motion:reduce){.crewchip.yours{animation:none}}
.links{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;background:transparent;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer;font-size:15px;min-height:48px}
.lrow:first-child{border-top:0}
.tap{cursor:pointer}
.rk{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted)}
.rcard .head{padding-bottom:10px}.lrow .muted{font-size:13px}
.rxrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;font-weight:600}
.rx{display:inline-flex;align-items:center;gap:3px;min-height:28px;padding:2px 8px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-size:13px;cursor:pointer;line-height:1}
.rx span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.rx.on{border-color:var(--gold);background:var(--gold-soft)}
.rx[disabled]{cursor:default}
.rxbar{display:inline-flex;flex-wrap:wrap;max-width:100%;gap:2px;padding:2px;border-radius:16px;background:var(--ink)}
.rxbar button{border:0;background:transparent;font-size:18px;width:32px;height:32px;border-radius:99px;cursor:pointer;padding:0}
.rxbar button:hover{background:rgba(255,255,255,.18)}
.arch{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.arch>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;background:transparent;border:0;cursor:pointer;text-align:left;min-height:56px}
.arch .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;font-size:14px}
.arch ol{margin:0;padding-left:26px;columns:2;column-gap:28px}
@media (max-width:480px){.arch ol{columns:1}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>
<script defer src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>
<script src="game.js"></script>
<script>
"use strict";
/* ---------------- storage ---------------- */
const store = {
  get(k,d=null){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch{return d} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }
};
const params = new URLSearchParams(location.search);
const SEAT = (params.get("seat")||"").replace(/[^a-z0-9]/gi,"").slice(0,8); // lets one browser hold several seats for testing
function rid(n=10){ const a="abcdefghijkmnpqrstuvwxyz23456789"; let s=""; const r=crypto.getRandomValues(new Uint8Array(n)); for(const x of r) s+=a[x%a.length]; return s; }
function crewCode(){ const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let s=""; const r=crypto.getRandomValues(new Uint8Array(6)); for(const x of r) s+=a[x%a.length]; return s; }
// One identity per crew per phone, so you are the same player every day and every round.
const pidKey = g => "mr.pid."+g+(SEAT?"."+SEAT:"");
function pidFor(g){ const k=pidKey(g); let p=store.get(k); if(!p){ p=rid(); store.set(k,p);} return p; }
function myPid(){ return pidFor(S.group); }
function setPid(p){ store.set(pidKey(S.group),p); pushProfile("crews/"+S.group, {pid:p, at:Date.now()}); }
function myName(){ return store.get("mr.name"+(SEAT?"."+SEAT:""),""); }
function setName(n){ store.set("mr.name"+(SEAT?"."+SEAT:""),n); pushProfile("name", n); }

/* ---------------- sync (Firebase Realtime Database) ----------------
   Each round is an append-only event log at rounds/<crew>-<day>-<n>/events. Firebase push keys sort
   by time, so every phone reads the same order and folds it into the same game state.
   crewRounds/<crew>/<day>/<n> lists the rounds opened that day. Nothing expires. */
const roundKey = (g,day,n) => `${g}-${day}-${n}`;
const S = {open:{}, group:null, day:0, round:0, code:null, events:[], ids:[], conn:"idle", synced:false, busy:false, err:"", draft:"", sugIdx:0, myOrder:null, lastPickCount:0, auto:{}, next:null, probing:false, unsubRound:null, unsubDay:null};
function stopSync(){ if(S.unsubRound){ S.unsubRound(); S.unsubRound=null; } if(S.unsubDay){ S.unsubDay(); S.unsubDay=null; } }
async function connect(n){
  const gen = S.gen = (S.gen||0)+1;
  if(S.unsubRound){ S.unsubRound(); S.unsubRound=null; }
  if(S.unsubDay){ S.unsubDay(); S.unsubDay=null; }
  S.round=n; S.code=roundKey(S.group,S.day,n); S.rxOpen=null;
  if(S.group){ const mk="mr.maxround."+S.group+"."+S.day; if(n>store.get(mk,0)) store.set(mk,n); }
  S.events=[]; S.ids=[]; S.conn="connecting"; S.synced=false; S.myOrder=null; S.draft=""; S.confirmWrite=null; S.lastPickCount=0; S.next=null; S.err="";
  const k=S.code;
  let db; try{ ({db}=await fb()); }catch(e){ if(S.gen===gen){ S.conn="down"; S.err=e.message; render(); } return; }
  if(S.gen!==gen) return;
  const ref=db.ref("rounds/"+k+"/events").orderByKey();
  const cb=snap=>{
    if(S.gen!==gen) return;
    const ids=[], evs=[];
    const pairs=[]; snap.forEach(c=>{ const e=c.val(); if(e && typeof e.type==="string") pairs.push([c.key,e]); });
    for(const [k,e] of arrivalOrder(pairs)){ ids.push(k); evs.push(e); }
    S.ids=ids; S.events=evs; S.synced=true; S.conn = S.online===false ? "reconnecting" : "live"; remoteRender(); watchNext();
  };
  ref.on("value", cb, ()=>{ S.conn="down"; render(); });
  S.unsubRound=()=>ref.off("value",cb);
}
/* A phone stamps each event's key when the player taps, so a message that was stuck on a weak
   connection would slot in where it was sent. Rounds whose create carries a server timestamp (sv)
   are replayed in the order the server received each event instead, so a late message lands last
   and the usual checks reject it. Older rounds keep key order and replay exactly as they were played. */
const PUSH_CHARS="-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz";
function keyTime(k){ let t=0; for(let i=0;i<8;i++) t=t*64+PUSH_CHARS.indexOf(k[i]); return t; }
function arrivalOrder(pairs){
  const first=pairs[0] && pairs[0][1];
  if(!first || first.type!=="create" || typeof first.sv!=="number") return pairs;
  const tm=([k,e])=> typeof e.sv==="number" ? e.sv : keyTime(k);
  return pairs.slice().sort((a,b)=>tm(a)-tm(b) || (a[0]<b[0]?-1:a[0]>b[0]?1:0));
}
async function send(e){
  // Capture the round now: the player may navigate away while this is still sending.
  const code=S.code, group=S.group, day=S.day, round=S.round, events=S.events;
  const {db, uid} = await fb();
  const ev = {...e, pid: e.pid || pidFor(group), uid, at: Date.now(), sv: firebase.database.ServerValue.TIMESTAMP};
  for(const x in ev) if(ev[x]===undefined) delete ev[x];
  if(S.online===false) throw new Error("You're offline. Reconnect, then try again.");
  const ok = await Promise.race([
    db.ref("rounds/"+code+"/events").push(ev).then(()=>true, ()=>false),
    new Promise(r=>setTimeout(()=>r(null), 10000))
  ]);
  if(ok===null) throw new Error("Still sending… check your connection. It will appear once it goes through.");
  if(!ok) throw new Error("Couldn't send that. Check your connection and try again.");
  if(e.type==="create"){ await db.ref(`crewRounds/${group}/${day}/${round}`).set(true).catch(()=>{});
    if(crewAlertsOn(group)) saveSubFor(group); }   // a brand-new crew can only claim alert slots once it exists
  if(e.type==="pick" || e.type==="start"){
    const s=fold(events.concat([{...ev, sv:Date.now()}])); if(s.started){
      if(!s.draftDone) notifyPlayer("turn", onClock(s, s.picks.length), s.picks.length, code, group);
      else s.seats.forEach(p=>notifyPlayer("order", p, s.total, code, group)); }
  }
}
/* While a finished round is on screen, show a banner when a crewmate opens the next one. */
async function watchNext(){
  if(!S.code || S.next || S.watchingNext===S.code) return;
  const s=fold(S.events); if(!s.done) return;
  S.watchingNext=S.code;
  const k=S.code, nextN=S.round+1;
  try{
    const {db}=await fb();
    const ref=db.ref(`crewRounds/${S.group}/${S.day}/${nextN}`);
    const cb=async snap=>{
      if(!snap.val() || S.code!==k || S.next) return;
      const ev=(await db.ref("rounds/"+roundKey(S.group,S.day,nextN)+"/events").orderByKey().limitToFirst(8).get()).val()||{};
      const s2=fold(Object.keys(ev).sort().map(x=>ev[x]));
      if(S.code===k && s2.created){ S.next={n:nextN, topic:s2.topic.name, by:s2.name(s2.host)}; remoteRender(); }
    };
    ref.on("value", cb);
    if(S.unsubDay) S.unsubDay();
    S.unsubDay=()=>ref.off("value",cb);
  }catch{}
}
/* A new day (midnight Pacific) while a crew is open: move to today's game unless you're mid-draft,
   so friends who open the crew fresh and you land in the same round. */
function crewRollover(){
  if(!S.group || dayNumber()===S.day) return;
  const s=fold(S.events);
  if(!s.started || s.done || !s.seats.includes(myPid())) return openCrew(S.group);
  render();   // mid-game: finish first, the banner offers the jump
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState!=="visible") return;
  if(S.group) crewRollover(); else { fetchCrewStatus(crewList().map(c=>c.g), true); if(!typing()) render(); }
});
window.addEventListener("online", ()=>{ if(S.group && (S.conn==="down" || !S.code)) openCrew(S.group); else remoteRender(); });
const typing = () => { const ae=document.activeElement; return !!(ae && (ae.tagName==="INPUT"||ae.tagName==="TEXTAREA") && ae.closest("#app")); };
/* Other players' moves arrive at any time. While someone is typing, hold the redraw until they leave
   the box: rebuilding the page under an open phone keyboard closes it mid-word. */
function remoteRender(){ if(typing()){ S.pendingRender=true; return; } queueRender(); }
document.addEventListener("focusout", ()=>{ if(!S.pendingRender) return;
  setTimeout(()=>{ if(S.pendingRender && !typing()){ S.pendingRender=false; render(); } }, 400); });
let rq=0; function queueRender(){ if(rq) return; rq=setTimeout(()=>{rq=0;render();},0); }

/* ---------------- game state = fold over the event log ---------------- */
// Rounds created from this moment on use fair-play rules: no auto-picking for someone else, and only
// the player who made a pick can undo it. Older rounds keep the rules they were played under, so
// a game in progress replays identically on every phone.
const FAIR_PLAY_FROM = 1790531797011;
function fold(events){
  const s={created:false,host:null,topic:null,day:null,round:1,players:[],started:false,seats:[],picks:[],orders:{},finished:false};
  for(const e of events){
    const P = s.seats.length;
    const total = 4*P;
    const seated = s.seats.includes(e.pid);
    switch(e.type){
      case "create":
        // Only the first create counts. A topic this phone doesn't know means its copy of the game is old.
        if(s.sawCreate) break; s.sawCreate=true;
        if(!TOPIC[e.topic]){ s.unknownTopic=true; break; }
        if(!s.created){ s.created=true; s.createdAt=e.at||0; s.fair=(e.at||0)>=FAIR_PLAY_FROM; s.host=e.pid; s.topic=TOPIC[e.topic]; s.seen=[e.topic]; s.day=e.day|0; s.round=e.round|0||1; }
        break;
      case "retopic": {
        // A seated player swaps the round's topic in the lobby. n = topics shown so far, so two taps at once swap once.
        if(!s.created || s.started || !TOPIC[e.topic] || e.n!==s.seen.length || !s.players.some(p=>p.pid===e.pid)) break;
        s.topic=TOPIC[e.topic]; s.seen.push(e.topic); s.swappedBy=s.players.find(p=>p.pid===e.pid).name;
        break; }
      case "join": {
        if(!s.created || typeof e.name!=="string") break;
        const name = e.name.trim().slice(0,18) || "Player";
        const ex = s.players.find(p=>p.pid===e.pid);
        if(ex){ if(!s.started) ex.name=name; }
        else if(!s.started && s.players.length<4) s.players.push({pid:e.pid,name});
        break; }
      case "leave":
        if(!s.started) s.players = s.players.filter(p=>p.pid!==e.pid);
        break;
      case "start": {
        // Any seated player may start, so a round never stalls waiting on one person.
        if(!s.created || s.started || !s.players.some(p=>p.pid===e.pid) || s.players.length<2) break;
        const ids = s.players.map(p=>p.pid);
        const ord = Array.isArray(e.order) && e.order.length===ids.length && ids.every(i=>e.order.includes(i)) ? e.order : ids;
        s.started=true; s.seats=ord.slice();
        break; }
      case "pick": case "autopick": {
        if(!s.started || e.n!==s.picks.length || s.picks.length>=total) break;
        const who = onClock(s, s.picks.length);
        if(e.type==="pick" && e.pid!==who) break;
        if(e.type==="autopick" && (s.fair || !seated)) break;
        if(typeof e.text!=="string" || !key(e.text)) break;
        const ent = matchEntry(s.topic, e.text);
        const pk = ent ? "E"+ent.rank : "W"+key(e.text);
        if(s.picks.some(p=>p.k===pk)) break;
        s.picks.push({pid:who, label: ent?ent.label:titleCase(e.text), rank: ent?ent.rank:null, k:pk, auto:e.type==="autopick"});
        break; }
      case "undo": {
        if(!s.started || !s.picks.length || e.n!==s.picks.length-1 || Object.keys(s.orders).length) break;
        const last = s.picks[s.picks.length-1];
        if(e.pid===last.pid || (!s.fair && e.pid===s.host)) s.picks.pop();
        break; }
      case "order": {
        if(!s.started || s.finished || s.picks.length<total || s.orders[e.pid] || !seated) break;
        const o=e.order; if(Array.isArray(o) && o.length===4 && [0,1,2,3].every(i=>o.includes(i))) s.orders[e.pid]=o.slice();
        break; }
      case "finish":
        if(s.started && s.picks.length>=total && seated) s.finished=true;
        break;
      case "react": {
        // Tapping the same emoji again takes it back. Reactions ride on the pick, so an undone pick loses them.
        const p = s.picks[e.n];
        if(!p || (e.k && p.k!==e.k) || !REACTS.includes(e.text) || !s.players.some(x=>x.pid===e.pid)) break;
        const re = p.re || (p.re={}), who = re[e.text] || (re[e.text]=[]), i = who.indexOf(e.pid);
        if(i<0) who.push(e.pid); else who.splice(i,1);
        break; }
      default: s.unknownEvent=true;   // an event from a newer copy of the game: this copy would fold it wrong
    }
  }
  s.P = s.seats.length; s.total = 4*s.P;
  s.draftDone = s.started && s.picks.length>=s.total;
  s.done = s.draftDone && (s.finished || s.seats.every(p=>s.orders[p]));
  s.name = pid => (s.players.find(p=>p.pid===pid)||{}).name || "Player";
  s.seatIdx = pid => s.seats.indexOf(pid);
  return s;
}
const REACTS = ["\u{1F525}","\u{1F602}","\u{1F92F}","\u{1F410}","\u{1F44E}"];
/* Reaction chips under a pick, plus a button that opens the emoji bar (not on your own picks). */
function reactRow(s, p, me){
  const gi = s.picks.indexOf(p); if(gi<0) return "";
  const member = s.players.some(x=>x.pid===me);
  const chips = REACTS.filter(r=>p.re && p.re[r] && p.re[r].length).map(r=>{
    const mine = p.re[r].includes(me), names = p.re[r].map(s.name).join(", ");
    return `<button class="rx${mine?" on":""}" data-act="react" data-n="${gi}" data-e="${r}" title="${esc(names)}" ${member && p.pid!==me?"":"disabled"}>${r}<span>${p.re[r].length}</span></button>`;
  }).join("");
  const bar = S.rxOpen===gi ? `<span class="rxbar">${REACTS.map(r=>`<button data-act="react" data-n="${gi}" data-e="${r}" aria-label="React ${r}">${r}</button>`).join("")}</span>` : "";
  return chips||bar ? `<span class="rxrow">${chips}${bar}</span>` : "";
}
function onClock(s,n){ const P=s.seats.length, r=Math.floor(n/P), pos=n%P; return s.seats[r%2===0?pos:P-1-pos]; }
function picksOf(s,pid){ return s.picks.filter(p=>p.pid===pid); }
function standings(s){
  const rows = s.seats.map(pid=>{
    const picks = picksOf(s,pid), ord = s.orders[pid]||[0,1,2,3];
    const faces = ord.map(i=>picks[i]);
    return {pid, name:s.name(pid), seat:s.seatIdx(pid), faces, ...scoreFaces(faces, s.day)};
  }).sort((a,b)=>b.total-a.total);
  let place=0, prev=null;
  rows.forEach((r,i)=>{ if(r.total!==prev){ place=i+1; prev=r.total; } r.place=place; });
  return rows;
}

/* ---------------- crew record (kept on each phone from the results it sees) ---------------- */
function crewHistory(g){ return store.get("mr.hist."+g,[]); }
function saveResult(s,rows){
  const g=S.group, list=crewHistory(g);
  const id=S.code+":"+(s.createdAt||0);
  if(list.some(x=>x.k===id)) return;
  list.unshift({k:id, day:s.day, round:S.round, topic:s.topic.name, rows:rows.map(r=>({pid:r.pid,name:r.name,total:r.total,place:r.place}))});
  store.set("mr.hist."+g, list.slice(0,200));
}
function crewRecord(g){
  const by={};
  for(const game of crewHistory(g)) for(const r of game.rows){
    const x = by[r.pid] || (by[r.pid]={pid:r.pid,name:r.name,games:0,wins:0,pts:0});
    if(!x.seen){ x.name=r.name; } x.seen=true; // history is newest-first, so the first name seen is the latest
    x.games++; x.pts+=r.total; if(r.place===1) x.wins++;
  }
  return Object.values(by).map(x=>({...x, avg:Math.round(x.pts/x.games)})).sort((a,b)=>b.wins-a.wins||b.avg-a.avg);
}
function rememberCrew(g){
  const list=crewList().filter(x=>x.g!==g);
  list.unshift({g, at:Date.now()});
  store.set("mr.crews", list.slice(0,10));
  pushProfile("crews/"+g, {pid:pidFor(g), at:Date.now()}); pushProfile("left/"+g, null);   // rejoining undoes a leave
  if(crewAlertsOn(g)) saveSubFor(g);
}

/* ---------------- helpers ---------------- */
function crewList(){ const v=store.get("mr.crews",[]); return Array.isArray(v) ? v.filter(c=>c && typeof c.g==="string" && /^[A-Z0-9]{6}$/.test(c.g)) : []; }
function validSolo(st){ return !!(st && Array.isArray(st.picks) && st.picks.length<=4 && st.picks.every(p=>p && typeof p.label==="string")
  && Array.isArray(st.order) && st.order.length===4 && [0,1,2,3].every(i=>st.order.includes(i)) && (!st.locked || st.picks.length===4)); }
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pcol = i => `var(--p${i})`;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600); }
function crewURL(g){ const u=new URL(location.href); u.search="?g="+g; u.hash=""; return u.toString(); }
async function shareOrCopy(text, title, url){
  if(navigator.share){ try{ await navigator.share(url?{title,text,url}:{title,text}); return; }catch(e){ if(e && e.name==="AbortError") return; } }
  const full = url ? text+"\n"+url : text;
  try{ await navigator.clipboard.writeText(full); toast("Copied to clipboard"); }
  catch{ openPopup("pic", {text:full}); const ta=$("#sharebox"); if(ta){ ta.focus(); ta.select(); } }
}
function initials(label){ const w=label.replace(/^the\s+/i,"").split(/[\s-]+/).filter(x=>/[A-Za-z0-9]/.test(x)); return ((w[0]||"?")[0]+(w.length>1?w[w.length-1][0]:(w[0]||"")[1]||"")).toUpperCase(); }
const roundLabel = n => n<=1 ? "Daily topic" : "Bonus round "+(n-1);

/* mountain with four faces; marks = array of up to 4 short strings */
function mountain(marks=["?","?","?","?"], color="var(--rock)", big=false){
  const fx=[98,152,206,258], fy=[88,80,86,96];
  const faces = fx.map((x,i)=>`
    <g transform="translate(${x} ${fy[i]}) rotate(${[-6,2,-3,5][i]})">
      <ellipse rx="22" ry="28" fill="var(--face)" stroke="var(--rock-lo)" stroke-width="1.5"/>
      <path d="M-14 -8 Q0 -16 14 -8" stroke="var(--rock-lo)" stroke-width="1.3" fill="none" opacity=".55"/>
      <text y="7" text-anchor="middle" font-family="Alfa Slab One, Georgia, serif" font-size="${(marks[i]||"").length>2?12:17}" fill="var(--rock-lo)">${esc(marks[i]||"")}</text>
    </g>`).join("");
  return `<svg class="mtn" viewBox="0 0 360 ${big?170:150}" role="img" aria-label="Mountain with four carved faces" preserveAspectRatio="xMidYMax meet">
    ${big?`<circle cx="300" cy="34" r="20" fill="#FFF1D6" opacity=".95"/>`:""}
    <path d="M0 ${big?170:150} L0 118 L34 96 L52 102 L70 56 L98 36 L128 44 L152 26 L182 38 L214 30 L246 48 L276 58 L300 86 L326 92 L360 120 L360 ${big?170:150} Z" fill="${color}" opacity=".9"/>
    <path d="M70 56 L98 36 L128 44 L152 26 L182 38 L214 30 L246 48 L276 58 L300 86 L286 104 L66 108 Z" fill="var(--rock-hi)" opacity=".55"/>
    <path d="M0 ${big?170:150} L0 136 L60 124 L140 132 L220 122 L300 130 L360 126 L360 ${big?170:150} Z" fill="var(--rock-lo)" opacity=".85"/>
    ${faces}
  </svg>`;
}
function homeBtn(){ return `<button class="btn ghost small" data-act="home" aria-label="Back to home">&larr; Home</button>`; }
function brand(){ return `<button class="brand" data-act="home" aria-label="Home"><svg viewBox="0 0 34 22"><path d="M0 22 L8 8 L13 12 L19 2 L26 10 L30 7 L34 14 L34 22Z" fill="var(--rock)"/></svg><span class="bt">Mount Rushmore</span></button>`; }
function connBadge(){
  if(!S.group) return "";
  const cls = S.conn==="live"?"live":(S.conn==="down"?"bad":"");
  const txt = {idle:"loading",live:"live",connecting:"connecting",reconnecting:"reconnecting",down:"offline"}[S.conn]||S.conn;
  return `<span class="conn"><span class="dot ${cls}"></span>${esc(S.group)} · ${txt}</span>`;
}

/* ---------------- views ---------------- */
function homeView(){
  const n=dayNumber(), t=topicForDay(n);
  const crews = crewList();
  const st=store.get(soloKey(n),null), soloDone=validSolo(st)&&st.locked;
  const soloScore=soloDone?scoreFaces(st.order.map(i=>st.picks[i]), n).total:0;
  return `
  <div class="top">${brand()}<div class="row" style="gap:10px;flex-wrap:nowrap"><span class="conn">#${n}</span>${helpBtn()}</div></div>
  <div class="stack">
    <section class="hero">
      ${mountain(["?","?","?","?"],"var(--rock)",true)}
      <div class="copy">
        <div class="row" style="justify-content:space-between"><span class="eyebrow">Today's topic · #${n}</span>${streakBadge()}</div>
        <h1 class="display topic">${esc(t.name)}</h1>
        <div class="meta"><span>${t.note?esc(t.note)+" · ":""}New topic in ${untilTomorrow()}</span></div>
        <div class="playrow">
          <button class="btn gold" data-act="newcrew">${crews.length?"New crew":"Play with friends"}</button>
          <button class="btn" data-act="solo" style="background:var(--teal);color:#fff">${soloDone?"Solo: "+soloScore:"Play solo"}</button>
        </div>
      </div>
    </section>

    ${S.newCrew?`<section class="card stack" style="gap:10px">
      <label class="f" for="name">Your name<input class="t" id="name" maxlength="18" autocomplete="nickname" placeholder="e.g. Jo" value="${esc(myName())}"></label>
      <button class="btn gold block" data-act="create">Create crew &amp; get invite link</button>
      <div class="row" style="gap:8px"><input class="t" id="joincode" maxlength="6" placeholder="or join with a code" style="flex:1 1 160px;text-transform:uppercase;font-family:var(--mono);letter-spacing:.08em" autocomplete="off"><button class="btn ghost" data-act="joincode">Join</button></div>
      <div class="err" id="homeerr">${esc(S.err)}</div></section>`:""}

    ${crews.length?`<section class="stack" style="gap:6px"><span class="eyebrow">Your crews</span>
      <div class="crewrow">${[...crews].sort((a,b)=>!!crewMove(b.g)-!!crewMove(a.g)).map(c=>{ const mv=crewMove(c.g);
        return `<button class="crewchip${mv?" yours":""}" data-act="opencrew" data-g="${esc(c.g)}"><b>${esc(crewName(c.g)||c.g)}</b>${mv?`<span class="yourmove">${mv==="pick"?"Your pick":"Lock in yours"}</span>`:crewName(c.g)?`<span class="mono">${esc(c.g)}</span>`:""}</button>`; }).join("")}</div></section>`:""}

    <nav class="links" aria-label="More">

const lrow=(act,label,sub)=>`<button class="lrow" data-act="${act}"><span><b>${label}</b>${sub?`<span class="muted"> · ${sub}</span>`:""}</span><span aria-hidden="true">&rsaquo;</span></button>`;
/* A collapsible section that stays open across redraws (other players' moves redraw the page). */
function fold2(id, summary, body){ return `<details class="cons" ${S.open[id]?"open":""}><summary data-act="tog" data-id="${id}">${summary}</summary>${S.open[id]?body:""}</details>`; }
function roomView(){
  const head = `<div class="top compact">${brand()}<div class="row" style="gap:10px;flex-wrap:nowrap;min-width:0">${connBadge()}${helpBtn()}${homeBtn()}</div></div>`;
  if(S.probing || !S.code) return head+`<div class="card"><h2 class="display" style="font-size:24px">Finding today's game…</h2></div>`;
  const s = fold(S.events), me = myPid();
  document.title = "Mount Rushmore Daily";
  const t = topicForRound(S.group,S.day,S.round);
  const title = `<div class="stack" style="gap:2px;margin-bottom:14px"><span class="eyebrow">${crewName(S.group)?esc(crewName(S.group))+" · ":""}Mount Rushmore #${S.day} · ${roundLabel(S.round)}</span><h1 class="display" style="font-size:clamp(28px,7vw,40px)">${esc((s.topic||t).name)}</h1></div>`;
  if((!s.created && s.unknownTopic) || s.unknownEvent) return head+title+`<div class="card stack"><b>This round needs the latest version of the game.</b><button class="btn gold" data-act="reload">Update now</button></div>`;
  if(!s.created){
    if(myName()) return head+title+`<div class="card"><p class="muted" style="margin:0">Setting up the round…</p><div class="err">${esc(S.err)}</div></div>`;
    return head+title+nameBox("Join this crew", "You'll be dealt into today's game.");
  }
  const member = s.players.some(p=>p.pid===me);
  if(!s.started) return head+title+lobbyView(s,me,member);
  if(!s.seats.includes(me)) return head+title+spectatorClaim(s)+(s.done?resultsView(s,me):draftView(s,me,false));
  if(s.done) return head+title+resultsView(s,me);
  if(s.draftDone) return head+title+orderView(s,me);
  return head+title+draftView(s,me,true);
}
function nameBox(h, sub){

function inviteCard(){

function crewPanel(){

function lobbyView(s,me,member){
  const slots = [0,1,2,3].map(i=>{
    const p=s.players[i];
    return p ? `<div class="pl"><span class="chip" style="background:${pcol(i)}"></span><span class="n">${esc(p.name)}</span>${p.pid===me?`<span class="tag">you</span>`:""}</div>`
             : `<div class="pl empty">Open seat</div>`;
  }).join("");
  const joinBox = member ? "" : s.players.length>=4
      ? `<div class="card"><b>This round is full.</b> <span class="muted">Four players max. Catch the next one.</span></div>`
      : myName() ? `<div class="card row" style="justify-content:space-between"><span>You're sitting this one out.</span><button class="btn gold small" data-act="rejoin">Deal me in</button></div>`
      : nameBox("Join this round","Enter your name to take a seat.");
  const missing = crewRecord(S.group).filter(r=>!s.players.some(p=>p.pid===r.pid)).map(r=>r.name);
  const confirming = S.confirmStart===S.code;
  const startTxt = s.players.length<2 ? "Waiting for at least 1 friend…" : confirming ? "Start without "+missing.join(" & ")+"?" : "Start the draft ("+s.players.length+" players)";
  const ctl = member
      ? `${missing.length?`<div class="muted" style="font-size:14px">Not here yet: <b>${esc(missing.join(", "))}</b></div>`:""}
         <button class="btn gold block" data-act="start" ${s.players.length<2||S.busy?"disabled":""}>${esc(startTxt)}</button>
         <div class="row" style="justify-content:space-between"><span class="muted" style="font-size:13px">${s.swappedBy?`${esc(s.swappedBy)} swapped the topic.`:S.round>1?"Not feeling this one?":"Already played this one?"}</span><button class="btn ghost small" data-act="retopic" ${S.busy?"disabled":""}>New topic</button></div>
         <div class="row" style="justify-content:space-between"><span class="muted" style="font-size:13px">Anyone seated can start once everyone's in.</span><button class="btn ghost small" data-act="leave">Sit out</button></div>
         <div class="err">${esc(S.err)}</div>` : "";

function spectatorClaim(s){
  return `<div style="margin-bottom:14px">${fold2("claim"+S.code, "Are you one of these players? Rejoin on this device",
    `<div class="row" style="margin-top:10px">${s.seats.map((p,i)=>`<button class="btn ghost small" data-act="claim" data-pid="${esc(p)}"><span class="chip" style="background:${pcol(i)}"></span>${esc(s.name(p))}</button>`).join("")}</div>`)}</div>`;
}

function draftView(s,me,member){
  const n = s.picks.length, over = n>=s.total, who = over?null:onClock(s,n), mine = member && !over && who===me;
  const round = Math.floor(n/s.P)+1;
  const fresh = n > S.lastPickCount ? n-1 : -1; S.lastPickCount = n;
  document.title = mine ? "(Your pick) Mount Rushmore" : "Mount Rushmore Daily";
  if(mine && fresh>=0 && navigator.vibrate){ try{navigator.vibrate(60)}catch{} }
  const upcoming = [];
  for(let i=n;i<Math.min(s.total,n+8);i++){ const p=onClock(s,i); upcoming.push(`<span class="s ${i===n?"now":""}"><span class="chip" style="background:${pcol(s.seatIdx(p))}"></span>${i+1}. ${esc(s.name(p))}${p===me?" (you)":""}</span>`); }
  const cols = s.seats.map((pid,si)=>{
    const ps = picksOf(s,pid);
    const slots=[0,1,2,3].map(i=>{
      const p=ps[i]; if(!p) return `<div class="slot empty"><span class="i">${i+1}</span>—</div>`;
      const gi = s.picks.indexOf(p);
      const tap = member && p.pid!==me;
      return `<div class="slot ${gi===fresh?"fresh":""}${tap?" tap":""}"${tap?` data-act="rxopen" data-n="${gi}" tabindex="0" role="button" aria-label="React to ${esc(p.label)}"`:""}><span class="i">${i+1}</span><span class="l">${esc(p.label)}${p.auto?` <span class="tag">auto</span>`:""}${reactRow(s,p,me)}</span></div>`;
    }).join("");
    return `<div class="col ${pid===who?"onclock":""}" style="--pc:${pcol(si)}"><h3><span class="chip" style="background:${pcol(si)}"></span><span>${esc(s.name(pid))}${pid===me?" (you)":""}</span></h3>${slots}</div>`;
  }).join("");
  const last = s.picks[n-1];
  const canUndo = member && last && last.pid===me;
  return `<div class="stack">
    <div class="clock ${mine?"mine":""}">
      <div><div class="eyebrow">${over?"Draft complete":`Round ${round} of 4 · Pick ${n+1} of ${s.total}`}</div>
      <div class="who">${over?"Players are carving their order…":mine?"You're on the clock":esc(s.name(who))+" is picking…"}</div></div>
      ${canUndo?`<button class="btn ghost small" data-act="undo">${last.pid===me?"Undo my pick":"Undo "+esc(s.name(last.pid))+"'s pick"}</button>`:""}
    </div>
    ${mine?`<form class="pickbox stack" id="pickform" style="gap:6px" autocomplete="off">
      <div class="row" style="gap:8px;flex-wrap:nowrap">
        <input class="t" id="pick" placeholder="Name a ${esc(s.topic.name.replace(/s$/,"").toLowerCase())}…" maxlength="60" aria-label="Your pick" aria-autocomplete="list" aria-controls="sug" enterkeyhint="done">
        <button class="btn gold" type="submit" ${S.busy?"disabled":""}>Carve</button>
      </div>
      <div class="hint" id="hint"></div>
      <ul class="sug" id="sug" role="listbox"></ul>
      <div class="err">${esc(S.err)}</div>
    </form>`:""}
        ${!over && !mine && member ? `<button class="btn ghost small" data-act="nudge" style="align-self:flex-start">Nudge ${esc(s.name(who))}</button>` : ""}
    <div class="snake" aria-label="Upcoming picks">${upcoming.join("")}</div>
    <div class="board" style="--cols:${s.P}">${cols}</div>
    ${member && s.picks.some(p=>p.pid!==me) ? `<p class="muted" style="margin:0;font-size:12px">Tap a friend's pick to react.</p>` : ""}
  </div>`;
}

function orderView(s,me){
  const picks = picksOf(s,me);
  const locked = s.orders[me];
  if(!S.myOrder || S.myOrder.length!==4) S.myOrder=[0,1,2,3];
  const status = s.seats.map((p,i)=>`<div class="pl"><span class="chip" style="background:${pcol(i)}"></span><span class="n">${esc(s.name(p))}</span><span class="tag">${s.orders[p]?"locked":"ordering"}</span></div>`).join("");
  const body = locked
    ? `<div class="card"><b>Your mountain is locked.</b> <span class="muted">Waiting on the others.</span></div>`
    : `<section class="stack" style="gap:10px"><div><h2 class="display" style="font-size:22px">Carve your order</h2><p class="muted" style="margin:4px 0 0;font-size:14px">Put your best face in the Washington spot. Slots are scored against the consensus order.</p></div>
      <ol class="olist">${S.myOrder.map((pi,slot)=>`<li><span class="spot">#${slot+1}<br>${SPOTS[slot]}</span><span class="nm">${esc(picks[pi].label)}</span>
        <span class="arrows"><button data-act="up" data-i="${slot}" ${slot===0?"disabled":""} aria-label="Move up">&uarr;</button><button data-act="down" data-i="${slot}" ${slot===3?"disabled":""} aria-label="Move down">&darr;</button></span></li>`).join("")}</ol>
      <button class="btn gold block" data-act="lock" ${S.busy?"disabled":""}>Lock in my mountain</button><div class="err">${esc(S.err)}</div></section>`;
  const last=s.picks[s.picks.length-1], canUndo = last && last.pid===me && !Object.keys(s.orders).length;
  return `<div class="stack">${canUndo?`<button class="btn ghost small" data-act="undo" style="align-self:flex-start">Undo my last pick (${esc(last.label)})</button>`:""}${body}
    <section class="stack" style="gap:8px"><span class="eyebrow">Draft complete</span><div class="plist" style="grid-template-columns:1fr">${status}</div></section>
    ${locked && s.seats.some(p=>!s.orders[p]) ? `<button class="btn ghost small" data-act="nudge" style="align-self:flex-start">Nudge the crew</button>` : ""}
    ${locked?`<button class="btn ghost small" data-act="finish" style="align-self:flex-start">Score it now (anyone still ordering keeps draft order)</button>`:""}
  </div>`;
}

/* One compact scorecard: the four faces on one line each, bonus under the points. */
function scoreTable(s, rows, me){
  return `<table class="faces"><tbody>${rows.map(x=>{ const bonus=x.exact+x.right, gi=s?s.picks.indexOf(x.f):-1;
    const tap = s && gi>=0 && s.players.some(p=>p.pid===me) && x.f.pid!==me;
    return `<tr${tap?` class="tap" data-act="rxopen" data-n="${gi}" tabindex="0" role="button" aria-label="React to ${esc(x.f.label)}"`:""}>
      <td><div class="fn"><span class="tier" style="background:var(--t${tierOf(x.f.rank)})"></span>${x.slot+1}. ${esc(x.f.label)} <span class="rk">${x.f.rank?"#"+x.f.rank:"write-in"}</span></div>${s?reactRow(s,x.f,me):""}</td>
      <td class="pts">${x.pts}${bonus?`<div class="bonus" style="margin:0">+${bonus} bonus</div>`:""}</td></tr>`; }).join("")}</tbody></table>`;
}
function resultsView(s,me){

      <div class="display">${top.map(r=>esc(r.name)).join(" &amp; ")}</div>
      <div class="muted mono" style="margin-top:4px">${top[0].total} points${streak()>=2?` · ${streak()}-day streak`:""}</div>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn gold" data-act="shareres">Share</button></div>
      <div style="margin:10px -16px 0">${mountain(top[0].faces.map(f=>initials(f.label)), pcol(top[0].seat))}</div>
    </section>
    ${newDay || nextBanner}
    <div class="res">${cards}</div>
    ${fold2("cons"+S.code, `Reveal the full top ${s.topic.size}`, `<ol>${s.topic.entries.map(e=>`<li>${esc(e.label)}</li>`).join("")}</ol>`)}
    ${appNudgeCard()}
    ${crewPanel()}
  </div>`;
}
function shareText(s){
  const rows = standings(s), m=["","\u{1F947}","\u{1F948}","\u{1F949}","4️⃣"];
  const lines = [`\u{1F5FB} Mount Rushmore #${S.day}${S.round>1?" (bonus "+(S.round-1)+")":""} · ${s.topic.name}`, ""];
  for(const r of rows){
    lines.push(`${m[r.place]} ${r.name} — ${r.total}`);
    lines.push(`${r.faces.map(f=>TIER_EMO[tierOf(f.rank)]).join("")} ${r.faces.map(f=>f.label).join(", ")}`);
  }
  if(streak()>=2) lines.push("", "\u{1F525} "+streak()+"-day streak");
  return lines.join("\n");
}


/* ---------------- solo daily: guess the consensus top 4, one try per day, kept on this phone ---------------- */
const soloKey = d => "mr.solo."+d+(SEAT?"."+SEAT:"");
function soloTopic(){ return topicForDay(S.solo.day); }
function soloState(){
  const k=soloKey(S.solo.day);
  if(!S.soloMem || S.soloMem.k!==k){ const v=store.get(k,null); S.soloMem={k, st: validSolo(v) ? v : {picks:[], order:[0,1,2,3], locked:false}}; }
  return JSON.parse(JSON.stringify(S.soloMem.st));
}
function soloSave(st){ S.soloMem={k:soloKey(S.solo.day), st:JSON.parse(JSON.stringify(st))}; store.set(S.soloMem.k, st); pushProfile("solo/"+S.solo.day, JSON.stringify(st)); }
function soloPick(text){
  const st=soloState(), t=soloTopic();
  text=(text||"").trim(); if(!key(text) || st.picks.length>=4 || st.locked) return;
  const m=matchEntry(t,text), k=m?"E"+m.rank:"W"+key(text);
  if(st.picks.some(p=>p.k===k)){ S.err=(m?m.label:titleCase(text))+" is already on your mountain."; render(); return; }
  st.picks.push({label:m?m.label:titleCase(text), rank:m?m.rank:null, k});
  soloSave(st); S.draft=""; S.sugIdx=0; S.confirmWrite=null; S.err="";
  const inp=$("#pick"); if(inp) inp.value="";
  render(); $("#pick")?.focus();
}
function soloShareText(st){

}

const ACCT = {user:null, busy:false, synced:false};
/* Played days from every device are merged, never overwritten, so a streak can't lose a day. */
function pushDays(list){
  if(!ACCT.user || !ACCT.synced) return;
  const uid=ACCT.user.uid;
  fb().then(({db})=>db.ref("users/"+uid+"/days").transaction(cur=>{ let r=[]; try{ r=JSON.parse(cur||"[]"); }catch{}
    return JSON.stringify([...new Set((Array.isArray(r)?r:[]).concat(list))].filter(Number.isFinite).sort((a,b)=>a-b).slice(-400)); })).catch(()=>{});
}
function pushProfile(path, val){
  if(!ACCT.user || !ACCT.synced) return;
  const uid=ACCT.user.uid;
  fb().then(({db})=>db.ref("users/"+uid+"/"+path).set(val)).catch(()=>{});
}
/* Merge this device with the account: the account's crew seats win (so you are the same player
   everywhere), and anything only this device has is added to the account. */
async function syncProfile(){
  const u=ACCT.user; if(!u) return;
  try{
    const {db}=await fb(); const ref=db.ref("users/"+u.uid);
    const p=(await ref.get()).val()||{}, upd={};
    if(p.name){ if(p.name!==myName()) store.set("mr.name"+(SEAT?"."+SEAT:""), p.name); } else if(myName()) upd.name=myName();
    const left=p.left||{}, local=crewList().filter(c=>!left[c.g]), remote=p.crews||{};
    const live = S.group ? fold(S.events) : null;
    const playingNow = g => live && g===S.group && (live.players.some(p=>p.pid===pidFor(g)) || live.seats.includes(pidFor(g)));
    for(const [g,v] of Object.entries(remote)){ if(left[g]) continue;
      if(v && v.pid && !playingNow(g)) store.set(pidKey(g), v.pid);   // account seat wins, except mid-round on this device
      if(!local.some(c=>c.g===g)) local.push({g, at:(v&&v.at)||0});
    }
    for(const c of local) if(!remote[c.g]) upd["crews/"+c.g]={pid:pidFor(c.g), at:c.at||Date.now()};
    for(const g of Object.keys(left)) if(remote[g]) upd["crews/"+g]=null;
    local.sort((a,b)=>(b.at||0)-(a.at||0)); store.set("mr.crews", local.slice(0,10));
    let rd=[]; try{ rd=JSON.parse(p.days||"[]"); }catch{}
    const allDays=[...new Set(playedDays().concat(Array.isArray(rd)?rd:[]))].filter(Number.isFinite).sort((a,b)=>a-b).slice(-400);
    store.set("mr.days", allDays); if(allDays.length!==(Array.isArray(rd)?rd.length:0)) setTimeout(()=>pushDays(allDays), 0);
    const d=dayNumber(), key=soloKey(d), ls=store.get(key,null);
    let rs=null; try{ rs=p.solo&&p.solo[d]?JSON.parse(p.solo[d]):null; }catch{}
    const score=st=>!validSolo(st)?-1:(st.locked?10:0)+st.picks.length;
    if(rs && score(rs)>score(ls)){ store.set(key, rs); S.soloMem=null; }
    else if(ls && score(ls)>score(rs)) upd["solo/"+d]=JSON.stringify(ls);
    // Earlier days' finished solo games fill in past topics and stats on a new device.
    for(const [pd,v] of Object.entries(p.solo||{})){ if(+pd===d || store.get(soloKey(+pd),null)) continue; try{ const o=JSON.parse(v); if(validSolo(o) && o.locked) store.set(soloKey(+pd), o); }catch{} }
    if(Object.keys(upd).length) await ref.update(upd);
    ACCT.synced = true;
  }catch(e){}
  render();
}
async function applyAccount(u){
  if(!u || u.isAnonymous) return;
  const same = ACCT.user && ACCT.user.uid===u.uid && ACCT.synced;
  ACCT.user=u; B.uid=u.uid;
  if(!same){ ACCT.synced=false; await syncProfile(); }
}
async function signInGoogle(){
  if(typeof firebase==="undefined" || ACCT.busy) return;
  const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FB_CONFIG);
  const auth = app.auth(), prov = new firebase.auth.GoogleAuthProvider();
  ACCT.busy=true; render();
  try{
    // Open the popup straight from the tap (browsers block popups opened after a delay).
    if(auth.currentUser && auth.currentUser.isAnonymous) await auth.currentUser.linkWithPopup(prov);
    else await auth.signInWithPopup(prov);
    await applyAccount(auth.currentUser);
    toast("Signed in. Your crews now follow you across devices.");
  }catch(e){
    if(e && e.code==="auth/credential-already-in-use"){
      // This Google account is already set up on another device: switch to it.
      try{ await auth.signInWithCredential(firebase.auth.GoogleAuthProvider.credentialFromError(e)); await applyAccount(auth.currentUser); toast("Signed in. Synced with your other devices."); }
      catch(e2){ toast("Couldn't sign in. Try again."); }
    } else if(e && e.code==="auth/popup-blocked") toast("Your browser blocked the sign-in window. Allow popups for this site and try again.");
    else if(!(e && /popup-closed|cancelled-popup/.test(e.code||""))) toast("Couldn't sign in ("+String((e&&e.code)||"unknown").replace("auth/","")+"). Try again.");
  }
  ACCT.busy=false; render();
}
async function signOutGoogle(){
  try{ const auth=firebase.auth(); await auth.signOut(); await auth.signInAnonymously(); }catch{}
  ACCT.user=null; ACCT.synced=false; render();
  toast("Signed out. This device keeps its copy.");
}

const B = {day:null, rows:[], uid:null, loaded:false, err:"", posting:false, unsub:null};
/* Scores are recomputed from the stored picks, so a post whose score doesn't match its picks is ignored. */
function boardRows(day, raw){
  const t = topicForDay(day), rows=[];
  for(const [uid,v] of Object.entries(raw||{})){
    if(!v || !v.picks || typeof v.name!=="string") continue;
    const labels=[0,1,2,3].map(i=>v.picks[i]).filter(x=>typeof x==="string");
    if(labels.length!==4) continue;
    const faces=labels.map(l=>{ const m=matchEntry(t,l); return {label:m?m.label:l, rank:m?m.rank:null}; });
    if(new Set(faces.map(f=>f.rank?"E"+f.rank:"W"+key(f.label))).size!==4) continue;   // the same face four times isn't a mountain
    const score=scoreFaces(faces, day).total;
    if(score!==v.score) continue;
    const td = typeof v.ts==="number" ? dayNumber(new Date(v.ts)) : day;   // posted on its day (or just after midnight)
    if(td<day || td>day+1) continue;
    rows.push({uid, name:v.name, score, ts:v.ts||0, faces});
  }
  rows.sort((a,b)=>b.score-a.score||a.ts-b.ts);
  let place=0, prev=null; rows.forEach((r,i)=>{ if(r.score!==prev){ place=i+1; prev=r.score; } r.place=place; });
  return rows;
}
async function watchBoard(day){
  if(B.day===day) return;   // already watching (or loading) this day
  if(B.unsub){ B.unsub(); B.unsub=null; }
  Object.assign(B,{day, rows:[], me:null, meChecked:false, count:0, loaded:false, err:"", autoTried:false});
  try{
    const {db} = await fb();
    if(B.day!==day) return;
    // Only the top 50 scores stream live; the day's player count is a single number.
    const top = db.ref("solo/"+day).orderByChild("score").limitToLast(50);
    const cnt = db.ref("soloCount/"+day);
    const cb = snap=>{ B.rows=boardRows(day, snap.val()); B.loaded=true; B.err=""; refreshMe(); if(S.solo) remoteRender(); };
    const cc = snap=>{ B.count=+snap.val()||0; if(S.solo) remoteRender(); };
    top.on("value", cb, ()=>{ B.err="Leaderboard is unavailable right now."; render(); });
    cnt.on("value", cc, ()=>{});
    B.unsub = ()=>{ top.off("value", cb); cnt.off("value", cc); };
  }catch(e){ B.err=e.message||"Leaderboard is unavailable right now."; if(S.solo) render(); }
}
/* Your own row: from the top 50 if you're in it, otherwise fetched directly with its rank. */
async function refreshMe(){
  const day=B.day; if(!day) return;
  try{
    const {db, uid} = await fb(); B.uid=uid;
    const pu = S.solo ? soloState().postedUid : null;
    const ids = [...new Set([uid, pu].filter(Boolean))];
    let me = B.rows.find(r=>ids.includes(r.uid)) || null;
    if(!me){
      for(const id of ids){
        const v=(await db.ref("solo/"+day+"/"+id).get()).val(); if(!v) continue;
        const r=boardRows(day, {[id]:v})[0]; if(!r) continue;
        const above=(await db.ref("solo/"+day).orderByChild("score").startAt(r.score+1).get()).val();
        r.place = boardRows(day, above).length + 1; me=r; break;
      }
    }
    if(B.day!==day) return;
    B.me=me; B.meChecked=true; if(S.solo) remoteRender(); maybeAutoPost();
  }catch{}
}

/* ---------------- "your move" on the home screen ----------------
   Reads each crew's newest round for today and marks the ones waiting on you: your pick in the
   draft, or your mountain still to lock in. Refreshed on the home screen at most every 15s and
   whenever the app comes back to the front. Also sets the home-screen icon's badge count. */
const CS = {state:{}, at:0, busy:false};
function crewMove(g){ return CS.state[g] || null; }
async function fetchCrewStatus(list, force){
  if(!list.length){ try{ navigator.clearAppBadge && navigator.clearAppBadge().catch(()=>{}); }catch{} return; }
  if(CS.busy || (!force && Date.now()-CS.at < 15000)) return;
  CS.busy=true; CS.at=Date.now();
  try{
    const {db}=await fb(), day=dayNumber();
    await Promise.all(list.map(async g=>{
      try{
        const ns=Object.keys((await db.ref(`crewRounds/${g}/${day}`).get()).val()||{}).map(Number).filter(x=>x>0);
        if(!ns.length){ delete CS.state[g]; return; }
        const evs=[], pairs=[];
        (await db.ref("rounds/"+roundKey(g,day,Math.max(...ns))+"/events").orderByKey().get()).forEach(c=>{ const e=c.val(); if(e && typeof e.type==="string") pairs.push([c.key,e]); });
        for(const [,e] of arrivalOrder(pairs)) evs.push(e);
        const s=fold(evs), me=pidFor(g);
        CS.state[g] = !s.seats.includes(me) || s.done ? null
          : !s.draftDone ? (onClock(s, s.picks.length)===me ? "pick" : null)
          : (!s.orders[me] ? "lock" : null);
      }catch{}
    }));
    const n=list.filter(g=>CS.state[g]).length;
    try{ if(navigator.setAppBadge) (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(()=>{}); }catch{}
    if(!S.group && !S.solo) remoteRender();
  }catch{} finally{ CS.busy=false; }
}

/* ---------------- daily streak: consecutive days with a finished solo game or crew round ---------------- */
function playedDays(){ const d=store.get("mr.days",[]); return Array.isArray(d)?d:[]; }
function markPlayed(day){
  const d=playedDays(); if(d.includes(day)) return;
  d.push(day); d.sort((a,b)=>a-b); const keep=d.slice(-400);
  store.set("mr.days", keep); pushDays(keep);
}
function streak(){
  const set=new Set(playedDays()); let day=dayNumber(); if(!set.has(day)) day--;   // today not played yet: yesterday keeps it alive
  let n=0; while(set.has(day)){ n++; day--; } return n;
}
function streakBadge(){ const n=streak(); return n>=1 ? `<span class="streak" title="Days in a row you've finished a game">${n}-day streak</span>` : ""; }


/* ---------------- "your turn" alerts (web push) + leaving a crew ---------------- */
const VAPID_PUBLIC = "BHLLp75RQ05Qp2yJO7Sfve9xQatx2aE_FyQ7pYY_qwEEuGts7jPPK15ZtMDyTOMjN7jUjDvZoB4CIUScDM8tdvo";
const alertsSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const alertsOn = () => store.get("mr.alerts", false) && alertsSupported() && Notification.permission === "granted";
const crewAlertsOn = g => alertsOn() && !store.get("mr.alertsOff."+g, false);

function vapidKey(){ const b=VAPID_PUBLIC.replace(/-/g,"+").replace(/_/g,"/"); const raw=atob(b+"=".repeat((4-b.length%4)%4)); return Uint8Array.from(raw, c=>c.charCodeAt(0)); }
async function pushSubscription(create){
  const reg = await navigator.serviceWorker.ready;
  return (await reg.pushManager.getSubscription()) || (create ? reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:vapidKey()}) : null);
}
/* Each device keeps its own alert slot (a signed-in phone and laptop share one account), keyed by a
   short fingerprint of that device's push address. Returns false if the server refused. */
const devKey = sub => hash(sub.endpoint).toString(36);
async function saveSubFor(g){
  try{ const sub=await pushSubscription(false); if(!sub) return true; const {db,uid}=await fb(); const pid=pidFor(g);
    await db.ref(`pidOwner/${g}/${pid}`).set(uid);   // this seat's alerts belong to this account
    await db.ref(`pushSubs/${g}/${pid}/${uid}`).update({[devKey(sub)]: JSON.parse(JSON.stringify(sub)), endpoint:null, keys:null, expirationTime:null});
    return true; }catch{ return false; }
}
async function dropSubFor(g){ try{ const sub=await pushSubscription(false); if(!sub) return; const {db,uid}=await fb(); await db.ref(`pushSubs/${g}/${pidFor(g)}/${uid}/${devKey(sub)}`).remove(); }catch{} }
async function enableAlerts(){
  if(!alertsSupported()){ if(isIOS() && !isStandalone()){ openPopup("ig"); toast("Add Rushmore to your Home Screen first, then turn on alerts from the app."); } else toast("This browser can't show alerts."); return; }
  const perm = await Notification.requestPermission();
  if(perm!=="granted"){ toast("Alerts are blocked. Allow notifications for Rushmore in your phone's settings."); return; }
  try{ await pushSubscription(true); }catch{ toast("Couldn't turn on alerts. Try again."); return; }
  store.set("mr.alerts", true);
  let failed=0; for(const c of crewList()) if(!store.get("mr.alertsOff."+c.g,false) && !(await saveSubFor(c.g))) failed++;
  toast(failed ? "Alerts on, but "+failed+" crew"+(failed>1?"s":"")+" couldn't be set up. Open that crew and try again." : "Alerts on. You'll hear when it's your turn."); render();
}
async function disableAlerts(){
  for(const c of crewList()) await dropSubFor(c.g);
  try{ const sub=await pushSubscription(false); if(sub) await sub.unsubscribe(); }catch{}
  store.set("mr.alerts", false); toast("Alerts off."); render();
}
async function toggleCrewAlerts(g){
  if(!alertsOn()) return enableAlerts();
  const off=!store.get("mr.alertsOff."+g,false);
  store.set("mr.alertsOff."+g, off);
  if(off) await dropSubFor(g); else if(!(await saveSubFor(g))){ store.set("mr.alertsOff."+g, true); toast("Couldn't turn on alerts for this crew. Try again."); render(); return; }
  toast(off?"Alerts off for this crew.":"Alerts on for this crew."); render();
}

  x.globalAlpha=.85; x.fillStyle=IMG.lo; x.fill(new Path2D("M0 170 L0 136 L60 124 L140 132 L220 122 L300 130 L360 126 L360 170 Z")); x.globalAlpha=1;

    x.beginPath(); x.ellipse(0,0,22,28,0,0,7); x.fillStyle=IMG.face; x.fill(); x.lineWidth=1.5; x.strokeStyle=IMG.lo; x.stroke();

function longestStreak(){ const d=playedDays(); let best=0, run=0, prev=null; for(const x of d){ run = prev!==null && x===prev+1 ? run+1 : 1; best=Math.max(best,run); prev=x; } return best; }
