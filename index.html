      <div class="spotrow" aria-hidden="true"><span>#1<br>Washington</span><span>#2<br>Jefferson</span><span>#3<br>Roosevelt</span><span>#4<br>Lincoln</span></div></div></div>
    <div class="step"><div class="num">4</div><div><b>Face the judges</b><p>Every pick is scored by where it sits on a consensus top 24 built from published polls and rankings. Points fall fast, so the top of the board is the prize: #1 is worth 150, #2 136, #4 112, #10 68, down to 36 for #24. A write-in off the board earns a pity 15. A perfect mountain scores ${maxScore(SCORE2_FROM)}.</p>
      <div class="legend" style="margin-top:8px">${[1,2,3,4].map(x=>`<span><span class="tier" style="background:var(--t${x})"></span>${TIER_TXT[x]}</span>`).join("")}</div></div></div>
    <div class="step"><div class="num">&#9733;</div><div><b>No crew? Go solo</b><p>Guess the consensus top 4 on your own, once a day, and see where you rank against everyone playing.</p></div></div>
    <button class="btn gold block" data-act="helpclose" style="margin-top:14px">Let's carve</button>
  </div></div>`;
}

/* ---------------- suggestions ---------------- */
function taken(s){ return new Set(s.picks.map(p=>p.k)); }
function updateSuggest(){
  const inp=$("#pick"); if(!inp) return;
  const s = S.solo ? {topic:soloTopic()} : fold(S.events);
  const tk = S.solo ? new Set(soloState().picks.map(p=>p.k)) : taken(s), txt=inp.value, k=key(txt);
  const sug=$("#sug"), hint=$("#hint");
  S.draft = txt;
  if(!k){ sug.innerHTML=""; hint.innerHTML=""; return; }
  const list = s.topic.entries.filter(e=>!tk.has("E"+e.rank) && (e.keys.some(x=>x.includes(k)) || key(e.label).split(" ").some(w=>w.startsWith(k))))
    .sort((a,b)=>a.label.localeCompare(b.label)).slice(0,6);
  if(S.sugIdx>=list.length) S.sugIdx=0;
  sug.innerHTML = list.map((e,i)=>`<li><button type="button" role="option" data-act="sug" data-label="${esc(e.label)}" aria-selected="${i===S.sugIdx}">${esc(e.label)}</button></li>`).join("");
  const m = matchEntry(s.topic, txt);
  const dup = m ? tk.has("E"+m.rank) : tk.has("W"+k);
  hint.innerHTML = !dup && !m && list.length && S.confirmWrite===k ? `Tap a suggestion, or press <b>Carve</b> again to write in "${esc(titleCase(txt))}" (${WRITE_IN} pts)` : dup ? `<span class="err">${S.solo?"Already on your mountain.":"Already drafted."}</span>` : m ? `Matches <b>${esc(m.label)}</b>` : list.length ? `Tap a suggestion, or keep typing` : `Not on the board: counts as a write-in (${WRITE_IN} pts)`;
}

/* ---------------- navigation ---------------- */
function setURL(g){ history.pushState(null,"",g?"?g="+g+(SEAT?"&seat="+SEAT:""):location.pathname+(SEAT?"?seat="+SEAT:"")); }
/* Open a crew on today's most recent round (round 1 = the daily topic). */
async function openCrew(g){
  stopSync();
  S.group=g; S.day=dayNumber(); S.code=null; S.probing=true; S.err=""; S.watchingNext=null; rememberCrew(g); render();
  let n=0;
  try{
    const {db}=await fb();
    const v=(await db.ref(`crewRounds/${g}/${S.day}`).get()).val()||{};
    const cands=Object.keys(v).map(Number).filter(x=>x>0).sort((a,b)=>b-a);
    for(const c of cands.slice(0,6)){
      const first=(await db.ref("rounds/"+roundKey(g,S.day,c)+"/events").orderByKey().limitToFirst(1).get()).val();
      if(first && Object.values(first)[0].type==="create"){ n=c; break; }
    }
  }catch(e){ S.err=e.message; }
  if(S.group!==g) return;
  S.probing=false; connect(Math.max(1,n)); render();
}
/* Everything a screen leaves behind: listeners, half-typed text, open menus. */
function leaveScreen(){ dropPopups(); S.rxOpen=null; S.draft=""; S.confirmWrite=null; S.solo=null; S.page=null; ARCH.open=null; CN.editing=false; if(CN.off){ CN.off(); CN.off=null; } CN.watching=null; if(B.unsub){ B.unsub(); B.unsub=null; B.day=null; } stopSync(); S.group=null; S.code=null; S.err=""; document.title="Mount Rushmore Daily"; }
function goHome(){ leaveScreen(); setURL(null); render(); }

/* Automatic steps once the round's history has loaded: create the round if nobody has yet,
   and take a seat if you're part of the crew and haven't chosen to sit out. */
function autoSteps(){
  if(!S.code || S.busy || !S.synced) return;
  const s=fold(S.events), me=myPid(), name=myName(), k=S.code;
  if(!name) return;
  if(!s.created && !s.unknownTopic && !S.auto[k+"c"]){
    S.auto[k+"c"]=true;
    const t=topicForRound(S.group,S.day,S.round);
    act(async()=>{ try{ await send({type:"create",topic:t.id,day:S.day,round:S.round}); }
      catch(e){ setTimeout(()=>{ if(S.code===k){ delete S.auto[k+"c"]; render(); } }, 5000); throw e; } });
    return;
  }
  if(s.created && !s.started && s.players.length<4 && !s.players.some(p=>p.pid===me) && !S.auto[k+"j"] && !store.get("mr.out."+k,false)){
    S.auto[k+"j"]=true;
    act(async()=>{ try{ await send({type:"join",name}); }
      catch(e){ setTimeout(()=>{ if(S.code===k){ delete S.auto[k+"j"]; render(); } }, 5000); throw e; } });
  }
}

/* A typed code must match a crew that exists, or a typo would quietly start a new empty crew. */
async function joinByCode(c){
  if(!/^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{6}$/.test(c)){ S.err = c.length!==6 ? "Crew codes are 6 characters." : "That's not a crew code (codes never use O, 0, I, 1 or L)."; render(); return; }
  try{ const {db}=await fb(); const [a,b]=await Promise.all([db.ref("crewRounds/"+c).get(), db.ref("crews/"+c).get()]);
    if(!a.exists() && !b.exists()){ S.err="No crew with that code. Check it with whoever sent it."; render(); return; } }
  catch{ S.err="Couldn't check that code. Check your connection."; render(); return; }
  setURL(c); openCrew(c);
}
async function doCreate(){
  const name=($("#name").value||"").trim();
  if(!name){ S.err="Add your name so friends know who's drafting."; render(); $("#name")?.focus(); return; }
  setName(name);
  const g=crewCode(); setURL(g); openCrew(g);
}
async function doPick(text){
  if(S.solo) return soloPick(text);
  const s=fold(S.events); const me=myPid();
  text=(text||"").trim(); if(!key(text)) return;
  const m=matchEntry(s.topic,text), pk=m?"E"+m.rank:"W"+key(text);
  if(taken(s).has(pk)){ S.err=(m?m.label:titleCase(text))+" is already drafted."; render(); return; }
  if(onClock(s,s.picks.length)!==me) return;
  const n=s.picks.length;
  await act(async()=>{ await send({type:"pick",n,text:m?m.label:text}); S.draft=""; S.sugIdx=0; S.confirmWrite=null; const inp=$("#pick"); if(inp) inp.value=""; });
}
async function act(fn){ if(S.busy) return; S.busy=true; S.err=""; render(); try{ await fn(); }catch(e){ S.err=e.message||String(e); } S.busy=false; render(); }

document.addEventListener("click", e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(a==="help"){ openPopup("help"); document.querySelector(".guide")?.focus(); return; }
  if(a==="helpclose" || (a==="helpclose-bg" && e.target===b)){ store.set("mr.seenHelp",true); return closePopups(); }
  if(a==="helpclose-bg") return;
  if(a==="picshare"){ navigator.share({files:[S.pic.file]}).catch(()=>{}); return; }
  if(a==="pictext"){ const t=S.pic.text; shareOrCopy(t, "Mount Rushmore").then(()=>{ if(S.pic && S.pic.file) closePopups(); }); return; }
  if(a==="tog"){ e.preventDefault(); S.open[b.dataset.id]=!S.open[b.dataset.id]; render(); return; }
  if(a==="picclose" || (a==="picclose-bg" && e.target===b)) return closePicture();
  if(a==="picclose-bg") return;
  if(a==="igopen") return openPopup("ig");
  if(a==="igclose" || (a==="igclose-bg" && e.target===b)) return closePopups();
  if(a==="igclose-bg") return;
  if(a==="home") return goHome();
  if(a==="reload"){ location.reload(); return; }
  if(a==="resetlocal"){ try{ for(const k of Object.keys(localStorage)) if(k.startsWith("mr.") && !/^mr\.(name|pid\.|crews$)/.test(k)) localStorage.removeItem(k); }catch{} S.soloMem=null; goHome(); return; }
  if(a==="create") return doCreate();
  if(a==="opencrew"){ setURL(b.dataset.g); return openCrew(b.dataset.g); }
  if(a==="joincode") return joinByCode(($("#joincode").value||"").toUpperCase().replace(/[^A-Z0-9]/g,""));
  if(a==="install"){ const ev=INSTALL.evt; if(ev){ ev.prompt(); ev.userChoice.finally(()=>{ INSTALL.evt=null; render(); }); } return; }
  if(a==="newcrew"){ S.newCrew=!S.newCrew; render(); if(S.newCrew) document.getElementById("name")?.focus(); return; }
  if(a==="suggest"){ S.showSuggest=!S.showSuggest; render(); if(S.showSuggest) document.getElementById("suggest")?.focus(); return; }
  if(a==="suggestsend") return sendSuggestion(($("#suggest")||{}).value);
  if(a==="me"){ S.page="me"; history.pushState(null,"","?me"+(SEAT?"&seat="+SEAT:"")); render(); window.scrollTo(0,0); return; }
  if(a==="archday"){ const d=+b.dataset.d; ARCH.open = ARCH.open===d ? null : d; render(); return; }
  if(a==="alertson") return enableAlerts();
  if(a==="alertsoff") return disableAlerts();
  if(a==="crewalerts") return toggleCrewAlerts(S.group);
  if(a==="leavecrew"){ if(S.confirmLeave===S.group) return leaveCrew(S.group); S.confirmLeave=S.group; render(); return; }
  if(a==="signin") return signInGoogle();
  if(a==="signout") return signOutGoogle();
  if(a==="solo"){ S.solo={day:dayNumber()}; S.err=""; history.pushState(null,"","?solo"+(SEAT?"&seat="+SEAT:"")); render(); window.scrollTo(0,0); return; }
  if(a==="sug" && S.solo) return soloPick(b.dataset.label);
  if(a==="solotoday"){ S.solo={day:dayNumber()}; S.soloMem=null; S.draft=""; S.err=""; render(); window.scrollTo(0,0); return; }
  if(S.solo){
    const st=soloState();
    if(a==="sremove" && !st.locked){ st.picks.splice(+b.dataset.i,1); st.order=[0,1,2,3]; soloSave(st); render(); return; }
    if((a==="sup"||a==="sdown") && !st.locked){ const i=+b.dataset.i, j=a==="sup"?i-1:i+1; [st.order[i],st.order[j]]=[st.order[j],st.order[i]]; soloSave(st); render(); return; }
    if(a==="slock" && st.picks.length===4){ st.locked=true; soloSave(st); render(); window.scrollTo(0,0); return; }
    if(a==="spost") return postSolo(($("#bname")||{}).value);
    if(a==="sshare" && st.locked){ const me=myBoardRow(), sc=scoreFaces(st.order.map(i=>st.picks[i]), S.solo.day);
      return sharePicture({day:S.solo.day, topic:soloTopic().name, sub:"Solo", name:myName(), place:me?`#${me.place} of ${Math.max(B.count,B.rows.length,me.place)} worldwide`:"",
        total:sc.total, rows:sc.rows}, soloShareText(st)+"\n"+location.origin+location.pathname+"?solo"); }
    return;
  }
  if(!S.code) return;
  const s=fold(S.events), me=myPid();
  if(a==="join"){ const nm=($("#jname").value||"").trim(); if(!nm){S.err="Add your name first."; render(); return;} setName(nm); store.set("mr.out."+S.code,false); delete S.auto[S.code+"j"]; render(); return; }
  if(a==="rejoin"){ store.set("mr.out."+S.code,false); delete S.auto[S.code+"j"]; render(); return; }
  if(a==="retopic"){ const s=fold(S.events); if(s.started) return; const t=swapTopic(S.group,S.day,S.round,s.seen);
    return act(()=>send({type:"retopic",topic:t.id,n:s.seen.length})); }
  if(a==="leave"){ store.set("mr.out."+S.code,true); return act(()=>send({type:"leave"})); }
  if(a==="start"){
    const missing = crewRecord(S.group).filter(r=>!s.players.some(p=>p.pid===r.pid));
    if(missing.length && S.confirmStart!==S.code){ S.confirmStart=S.code; render(); return; }
    const ids=s.players.map(p=>p.pid); for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]} return act(()=>send({type:"start",order:ids})); }
  if(a==="invite") return shareOrCopy(`Join ${crewName(S.group)?"\""+crewName(S.group)+"\" on ":"my "}Mount Rushmore crew. Same link every day, new topic daily. Crew code ${S.group}`, "Mount Rushmore", crewURL(S.group));
  if(a==="sug") return doPick(b.dataset.label);
  if(a==="undo") return act(()=>send({type:"undo",n:s.picks.length-1}));
  if(a==="autopick"){ const tk=taken(s); const best=s.topic.entries.find(x=>!tk.has("E"+x.rank)); if(best) return act(()=>send({type:"autopick",n:s.picks.length,text:best.label})); return; }
  if(a==="up"||a==="down"){ const i=+b.dataset.i, j=a==="up"?i-1:i+1; const o=S.myOrder; [o[i],o[j]]=[o[j],o[i]]; render(); return; }
  if(a==="lock") return act(()=>send({type:"order",order:S.myOrder.slice()}));
  if(a==="finish") return act(()=>send({type:"finish"}));
  if(a==="claim"){ setPid(b.dataset.pid); render(); toast("Rejoined as "+s.name(b.dataset.pid)); return; }
  if(a==="today"){ S.watchingNext=null; return openCrew(S.group); }
  if(a==="crewrename"){ CN.editing=true; render(); document.getElementById("crewname")?.focus(); return; }
  if(a==="crewcancel"){ CN.editing=false; render(); return; }
  if(a==="crewsave") return saveCrewName(S.group, ($("#crewname")||{}).value);
  if(a==="nudge"){
    const n=s.picks.length, topic=s.topic.name, crew=crewName(S.group);
    const msg = !s.draftDone
      ? `${s.name(onClock(s,n))}, you're on the clock! Pick ${n+1} of ${s.total} in Mount Rushmore${crew?" ("+crew+")":""}: ${topic}`
      : `Lock in your mountain! Everyone's waiting to see the scores for ${topic}${crew?" in "+crew:""}.`;
    if(!s.draftDone) notifyPlayer("turn", onClock(s,n), n); else s.seats.filter(p=>!s.orders[p]).forEach(p=>notifyPlayer("order", p, s.total));
    return shareOrCopy(msg, "Mount Rushmore", crewURL(S.group));
  }
  if(a==="bonus"){ S.watchingNext=null; connect(S.round+1); render(); return; }
  if(a==="shareres"){ const r=standings(s).find(x=>x.pid===me)||standings(s)[0];
    return sharePicture({day:S.day, topic:s.topic.name, sub:crewName(S.group)||(S.round>1?"Bonus "+(S.round-1):"Crew"), name:r.name,
      place:["","1st","2nd","3rd","4th"][r.place]+" of "+s.P, total:r.total, rows:r.rows, color:IMG.player[r.seat]}, shareText(s)+"\n"+crewURL(S.group)); }
  if(a==="rxopen"){ const n=+b.dataset.n; S.rxOpen = S.rxOpen===n ? null : n; render(); return; }
  if(a==="react"){ const n=+b.dataset.n, emo=b.dataset.e, k=S.code+":"+n+emo; S.rxOpen=null; render();
    // A second tap while the first is still sending would cancel it out: ignore it.
    S.rxSending=S.rxSending||new Set(); if(S.rxSending.has(k)) return; S.rxSending.add(k);
    send({type:"react", n, text:emo, k:(s.picks[n]||{}).k}).catch(err=>toast(err.message||"Couldn't react.")).finally(()=>S.rxSending.delete(k)); return; }
});
document.addEventListener("submit", e=>{
  if(e.target.id==="pickform"){ e.preventDefault(); const opts=[...document.querySelectorAll("#sug [data-label]")]; const inp=$("#pick");
    const m = S.solo ? {topic:soloTopic()} : fold(S.events); const exact = matchEntry(m.topic, inp.value);
    if(!exact && opts.length && S.sugNav) return doPick(opts[S.sugIdx].dataset.label);
    // Not on the board but close to something that is: make the write-in a deliberate second tap.
    if(!exact && opts.length && S.confirmWrite!==key(inp.value)){ S.confirmWrite=key(inp.value); $("#hint").innerHTML=`Tap a suggestion, or press <b>Carve</b> again to write in "${esc(titleCase(inp.value))}" (${WRITE_IN} pts)`; return; }
    doPick(inp.value); }
});
document.addEventListener("input", e=>{ if(e.target.id==="pick"){ S.sugIdx=0; S.sugNav=false; S.err=""; updateSuggest(); } if(e.target.id==="name"||e.target.id==="joincode") S.err=""; });
document.addEventListener("keydown", e=>{
  if((e.key==="Enter"||e.key===" ") && e.target.classList && e.target.classList.contains("tap")){ e.preventDefault(); e.target.click(); return; }
  if(e.key==="Escape" && (S.pic||S.ig||S.help)){ if(S.help) store.set("mr.seenHelp",true); return closePopups(); }
  if(e.target.id==="pick" && (e.key==="ArrowDown"||e.key==="ArrowUp")){
    const n=document.querySelectorAll("#sug [data-label]").length; if(!n) return; e.preventDefault(); S.sugNav=true;
    S.sugIdx=(S.sugIdx+(e.key==="ArrowDown"?1:-1)+n)%n; updateSuggest();
  }
  if(e.target.id==="joincode" && e.key==="Enter"){ e.preventDefault(); $('[data-act="joincode"]').click(); }
  if(e.target.id==="name" && e.key==="Enter"){ e.preventDefault(); doCreate(); }
  if(e.target.id==="suggest" && e.key==="Enter"){ e.preventDefault(); sendSuggestion(e.target.value); }
  if(e.target.id==="crewname" && e.key==="Enter"){ e.preventDefault(); saveCrewName(S.group, e.target.value); }
  if(e.target.id==="jname" && e.key==="Enter"){ e.preventDefault(); $('[data-act="join"]')?.click(); }
});
window.addEventListener("popstate", ()=>{ if(S.pic||S.ig||S.help){ dropPopups(); render(); return; } boot(); });

/* ---------------- render ---------------- */
function render(){
  const app=$("#app");
  // Keep whatever someone is typing (text, focus, cursor) across redraws triggered by other players.
  const keep={}; let focusId=null, a=0, b=0;
  for(const el of app.querySelectorAll("input[id]")) keep[el.id]=el.value;
  const ae=document.activeElement;
  if(ae && ae.tagName==="INPUT" && ae.id){ focusId=ae.id; try{ a=ae.selectionStart; b=ae.selectionEnd; }catch{} }
  if("pick" in keep) S.draft=keep.pick;
  if(S.solo && S.solo.day!==dayNumber()){ const st=store.get(soloKey(S.solo.day),null);   // an untouched game moves on; a started one waits
    if(!validSolo(st) || !st.picks.length){ S.solo.day=dayNumber(); S.draft=""; S.err=""; S.soloMem=null; } }
  document.documentElement.style.overflow = (S.help||S.ig||S.pic) ? "hidden" : "";
  if(S.group) watchCrewName(S.group); else { const gs=crewList().map(c=>c.g); fetchCrewNames(gs); fetchCrewStatus(gs); }
  let html;
  try{ html = (S.solo ? soloView() : S.group ? roomView() : S.page==="me" ? meView() : homeView()) + (S.help ? guideView() : "") + (S.ig ? installGuideView() : "") + (S.pic ? pictureView() : ""); }
  catch(err){ console.error(err); html = `<div class="card stack" style="margin-top:20px"><b>Something went wrong on this screen.</b>
    <div class="row"><button class="btn gold" data-act="home">Go home</button><button class="btn ghost" data-act="resetlocal">Reset this device's game data</button></div>
    <p class="muted" style="margin:0;font-size:13px">Resetting keeps your name and crews.</p></div>`; }
  app.innerHTML = html;
  for(const [id,v] of Object.entries(keep)){ const el=document.getElementById(id); if(el) el.value=v; }
  const ni=$("#pick"); if(ni){ ni.value=S.draft; updateSuggest(); }
  const now=document.querySelector(".snake .now"); if(now) now.parentElement.scrollLeft = now.offsetLeft - now.parentElement.offsetLeft - 8;
  const f=focusId && document.getElementById(focusId);
  if(f){ f.focus(); try{ f.setSelectionRange(a,b); }catch{} }
  autoSteps();
}
function boot(){
  const q=new URLSearchParams(location.search);
  const g=(q.get("g")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  // Same screen (e.g. back closed a popup): just redraw, keeping the solo day and listeners.
  if((g.length===6 && g===S.group) || (q.has("solo") && S.solo) || (q.has("me") && S.page==="me")){ dropPopups(); return render(); }
  leaveScreen();
  if(q.has("solo")){ S.solo={day:dayNumber()}; return render(); }
  if(g.length===6) return openCrew(g);
  S.page = q.has("me")||q.has("past")||q.has("stats") ? "me" : null;
  render();
}
if(!store.get("mr.seenHelp",false)) S.help=true;
boot();
fb().catch(()=>{});
document.addEventListener("DOMContentLoaded", ()=>render());
setInterval(()=>{ if(S.group) return crewRollover(); if(!typing()) render(); }, 60000);
</script>
