<style>
:root{
  --sky:#E7EEF2; --sky2:#D6E2EA; --card:#FBFCFD; --ink:#232A31; --muted:#66717C; --line:#CDD5DC;
  --rock:#8E98A2; --rock-hi:#B5BDC5; --rock-lo:#5F6973; --face:#C9CFD5;
  --gold:#C9862A; --gold-soft:#F4E3C4; --pine:#2F6B52; --flag:#B5452F;
  --p0:#2F6B52; --p1:#C07A1F; --p2:#B5452F; --p3:#3D6391;
  --t1:#2F7A56; --t2:#B98A16; --t3:#C0652E; --t4:#8E98A2;
  --display:"Alfa Slab One", "Rockwell", "Roboto Slab", Georgia, serif;
  --body:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"DM Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --sky:#10161D; --sky2:#18212A; --card:#19222B; --ink:#E6EBEF; --muted:#94A0AB; --line:#2C3743;
    --rock:#4F5B67; --rock-hi:#6B7885; --rock-lo:#36414C; --face:#7C8894;
    --gold:#E6A94A; --gold-soft:#3A2E1A; --pine:#5DB08A; --flag:#E26F55;
    --p0:#5DB08A; --p1:#E6A94A; --p2:#E26F55; --p3:#79A2D8;
    --t1:#5DB08A; --t2:#E0B53E; --t3:#E58A52; --t4:#7C8894;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:18px;letter-spacing:.3px;text-decoration:none;color:var(--ink);background:none;border:0;padding:0;cursor:pointer}
.brand svg{width:34px;height:22px}
.conn{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;font-family:var(--mono)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rock)}
.dot.live{background:var(--pine)} .dot.bad{background:var(--flag)}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
.display{font-family:var(--display);font-weight:400;letter-spacing:.2px;line-height:1.02}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
/* hero */
.hero{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,var(--sky2),var(--sky));border:1px solid var(--line)}
.hero svg.mtn{display:block;width:100%;height:auto}
.hero .copy{padding:4px 20px 22px;display:flex;flex-direction:column;gap:6px}
.topic{font-size:clamp(34px,8vw,56px)}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
/* buttons */
.btn{appearance:none;border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--sky);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;transition:transform .08s ease, opacity .15s}
.btn:active{transform:translateY(1px)}
.btn.gold{background:var(--gold);color:#1E1608}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{min-height:36px;padding:7px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input.t{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--sky);font-size:17px;min-height:48px}
input.t:focus{border-color:var(--gold);outline:none}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sky)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0;padding:0;list-style:none}
.steps li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px}
.steps b{display:block;font-family:var(--display);font-weight:400;font-size:15px;margin-bottom:2px}
@media (max-width:560px){.steps{grid-template-columns:1fr}}
/* lobby */
.invite{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.code{font-family:var(--mono);font-size:30px;letter-spacing:.18em;background:var(--gold-soft);border-radius:12px;padding:8px 14px}
.linkbox{flex:1 1 220px;min-width:0;font-family:var(--mono);font-size:13px;background:var(--sky);border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:all}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;min-width:0}
.pl span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl.empty{border-style:dashed;color:var(--muted);font-weight:400}
.chip{width:12px;height:12px;border-radius:4px;flex:none}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:99px;background:var(--sky2);color:var(--muted)}
/* draft */
.clock{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:14px;background:var(--card);border:1.5px solid var(--line)}
.clock.mine{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.clock .who{font-family:var(--display);font-size:24px}
.snake{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.snake .s{flex:none;font-size:12px;padding:5px 9px;border-radius:99px;border:1.5px solid var(--line);white-space:nowrap;display:flex;gap:6px;align-items:center}
.snake .s.now{background:var(--ink);color:var(--sky);border-color:var(--ink)}
.snake .s.turn{border-style:dashed}
.pickbox{position:relative}
.sug{list-style:none;margin:6px 0 0;padding:6px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);display:flex;flex-direction:column;gap:2px}
.sug:empty{display:none}
.sug button{width:100%;text-align:left;background:transparent;border:0;padding:10px 10px;border-radius:8px;cursor:pointer;font-size:16px}
.sug button[aria-selected="true"],.sug button:hover{background:var(--sky2)}
.hint{font-size:13px;min-height:18px;color:var(--muted)}
.hint b{color:var(--ink)}
.board{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:10px}
@media (max-width:560px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
.col{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.col.onclock{border-color:var(--gold)}
.col h3{font-size:15px;display:flex;gap:7px;align-items:center;min-width:0}
.col h3 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot{display:flex;gap:8px;align-items:baseline;padding:8px;border-radius:9px;background:var(--sky);font-weight:600;font-size:14px;min-height:38px;min-width:0}
.slot .i{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none}
.slot .l{overflow-wrap:anywhere}
.slot.empty{background:transparent;border:1.5px dashed var(--line);color:var(--muted);font-weight:400}
.slot.fresh{animation:carve .7s cubic-bezier(.2,.8,.2,1)}
@keyframes carve{0%{transform:scale(.92);background:var(--gold-soft)}60%{background:var(--gold-soft)}100%{transform:none}}
.err{color:var(--flag);font-size:14px;font-weight:600}
/* order */
.olist{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.olist li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--card);border:1.5px solid var(--line)}
.olist .spot{font-family:var(--mono);font-size:11px;color:var(--muted);width:92px;flex:none;line-height:1.2}
.olist .nm{flex:1;font-weight:700;min-width:0;overflow-wrap:anywhere}
.arrows{display:flex;gap:6px}
.arrows button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--sky);cursor:pointer;font-size:16px}
.arrows button[disabled]{opacity:.3;cursor:default}
/* results */
.winner{text-align:center;padding:22px 16px}
.winner .display{font-size:clamp(28px,7vw,44px)}
.res{display:flex;flex-direction:column;gap:12px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rcard .head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 4px}
.rcard .head h3{font-family:var(--display);font-weight:400;font-size:22px;display:flex;gap:10px;align-items:center;min-width:0}
.place{font-family:var(--mono);font-size:13px;color:var(--muted)}
.total{font-family:var(--display);font-size:34px;line-height:1}
.total small{font-family:var(--mono);font-size:12px;color:var(--muted)}
.rcard svg.mtn{display:block;width:100%;height:auto;max-height:170px}
.faces{width:100%;border-collapse:collapse;font-size:14px}
.faces td{padding:9px 16px;border-top:1px solid var(--line);vertical-align:top}
.faces td.pts{text-align:right;font-family:var(--mono);white-space:nowrap}
.faces .fn{font-weight:700}
.faces .sub{font-size:12px;color:var(--muted)}
.tier{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.bonus{font-size:11px;font-weight:700;color:var(--pine);margin-left:6px;white-space:nowrap}
details.cons{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
details.cons summary{cursor:pointer;font-weight:700}
details.cons ol{margin:10px 0 0;padding-left:26px;columns:2;column-gap:28px;font-size:14px}
@media (max-width:480px){details.cons ol{columns:1}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sky);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
.recent{display:flex;flex-direction:column;gap:6px;font-size:14px}
.recent a{color:var(--ink)}
textarea.share{width:100%;min-height:150px;font-family:var(--mono);font-size:13px;border-radius:12px;border:1.5px solid var(--line);background:var(--sky);padding:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------------- matching ---------------- */
function key(s){
  let t = String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()
    .replace(/&/g," and ").replace(/['’.]/g,"").replace(/[^a-z0-9]+/g," ").trim();
  t = t.replace(/^the /,"");
  return t.split(" ").filter(Boolean).map(w => (w.length>3 && w.endsWith("s") && !w.endsWith("ss")) ? w.slice(0,-1) : w).join(" ");
}
for (const t of TOPICS){
  t.entries = t.items.trim().split("\n").map((line,i)=>{
    const [label,...al] = line.split("|").map(x=>x.trim());
    const k = key(label);
    return {label, rank:i+1, keys:[k, ...al.map(key)], tokens:k.split(" ").filter(w=>w.length>=4)};
  });
  t.size = t.entries.length;
}
const TOPIC = Object.fromEntries(TOPICS.map(t=>[t.id,t]));
function matchEntry(t, text){
  const k = key(text); if(!k) return null;
  const exact = t.entries.find(e=>e.keys.includes(k)); if(exact) return exact;
  if(!k.includes(" ") && k.length>=4){ const c=t.entries.filter(e=>e.tokens.includes(k)); if(c.length===1) return c[0]; }
  if(k.length>=6){ const c=t.entries.filter(e=>e.keys[0].includes(k)); if(c.length===1) return c[0]; }
  return null;
}
function titleCase(s){ return s.trim().replace(/\s+/g," ").slice(0,40).replace(/\b([a-z])/g,(m,c)=>c.toUpperCase()); }

/* ---------------- daily ---------------- */
const EPOCH = new Date(2026,8,27); // Mount Rushmore #1
function dayNumber(d=new Date()){ const a=new Date(d.getFullYear(),d.getMonth(),d.getDate()); return Math.round((a-EPOCH)/864e5)+1; }
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const PERM = (()=>{ const r=mulberry(1776), p=TOPICS.map((_,i)=>i); for(let i=p.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[p[i],p[j]]=[p[j],p[i]]} return p; })();
function topicForDay(n){ const L=TOPICS.length; return TOPICS[PERM[((n-1)%L+L)%L]]; }

/* ---------------- scoring ---------------- */
const WRITE_IN = 15;
function basePts(rank){ return rank ? 100-(rank-1)*3 : WRITE_IN; }
function tierOf(rank){ return !rank ? 4 : rank<=4 ? 1 : rank<=10 ? 2 : 3; }
const TIER_EMO = {1:"\u{1F7E9}",2:"\u{1F7E8}",3:"\u{1F7E7}",4:"⬜"};
const TIER_TXT = {1:"Consensus top 4",2:"Top 10",3:"On the board",4:"Write-in"};
const SPOTS = ["Washington spot","Jefferson spot","Roosevelt spot","Lincoln spot"];
function scoreFaces(faces){
  // faces: 4 picks in the player's chosen order (slot 0 = #1)
  const eff = f => f.rank || 999;
  const ideal = faces.map((f,i)=>({f,i})).sort((a,b)=>eff(a.f)-eff(b.f)||a.i-b.i).map(x=>x.f);
  const rows = faces.map((f,slot)=>{
    const base = basePts(f.rank);
    const right = f.rank && ideal[slot]===f ? 10 : 0;
    const exact = f.rank===slot+1 ? 15 : 0;
    return {f, slot, base, right, exact, pts:base+right+exact};
  });
  return {rows, total: rows.reduce((s,r)=>s+r.pts,0)};
}

/* ---------------- storage ---------------- */
const store = {
  get(k,d=null){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch{return d} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }
};
const params = new URLSearchParams(location.search);
const SEAT = (params.get("seat")||"").replace(/[^a-z0-9]/gi,"").slice(0,8); // lets one browser hold several seats for testing
function rid(n=10){ const a="abcdefghijkmnpqrstuvwxyz23456789"; let s=""; const r=crypto.getRandomValues(new Uint8Array(n)); for(const x of r) s+=a[x%a.length]; return s; }
function roomCode(){ const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let s=""; const r=crypto.getRandomValues(new Uint8Array(6)); for(const x of r) s+=a[x%a.length]; return s; }
function myPid(code){ const k="mr.pid."+code+(SEAT?"."+SEAT:""); let p=store.get(k); if(!p){ p=rid(); store.set(k,p);} return p; }
function setPid(code,p){ store.set("mr.pid."+code+(SEAT?"."+SEAT:""),p); }

/* ---------------- relay (ntfy.sh pub/sub; rooms live ~12h) ---------------- */
const RELAY = "https://ntfy.sh/";
const topicPath = code => "mtrushmore-v1-"+code;
const S = {code:null, events:[], ids:[], conn:"idle", openedAt:0, es:null, busy:false, err:"", draft:"", sugIdx:0, myOrder:null, lastPickCount:0, homeTopic:"daily"};
function parseMsg(m){
  if(!m || m.event!=="message") return null;
  let e; try{ e=JSON.parse(m.message); }catch{ return null; }
  return e && typeof e==="object" && typeof e.type==="string" ? e : null;
}
function connect(code){
  S.code=code; S.events=[]; S.ids=[]; S.conn="connecting"; S.myOrder=null; S.lastPickCount=0;
  S.ready = new Promise(res=>{ S.readyRes=res; });
  openStream(code);
}
function openStream(code){
  if(S.es) S.es.close();
  const es = new EventSource(RELAY+topicPath(code)+"/sse?since=all");
  S.es = es;
  es.addEventListener("open", ()=>{ S.conn="live"; S.openedAt=Date.now(); S.readyRes && S.readyRes(); resync(); setTimeout(render,2600); render(); });
  es.onmessage = ev => {
    let m; try{ m=JSON.parse(ev.data); }catch{ return; }
    const e=parseMsg(m); if(!e || S.ids.includes(m.id)) return;
    S.ids.push(m.id); S.events.push(e); queueRender();
  };
  es.onerror = ()=>{
    if(es.readyState===2){ S.conn="down"; setTimeout(()=>{ if(S.es===es && S.code===code) openStream(code); }, 4000); }
    else S.conn="reconnecting";
    render();
  };
}
async function send(e){
  e.pid = e.pid || myPid(S.code); e.at = Date.now();
  await Promise.race([S.ready, new Promise(r=>setTimeout(r,4000))]);
  const r = await fetch(RELAY+topicPath(S.code), {method:"POST", body:JSON.stringify(e)});
  if(r.status===429) throw new Error("The game relay is busy. Wait a few seconds and try again.");
  if(!r.ok) throw new Error("Couldn't reach the game relay ("+r.status+"). Check your connection.");
  setTimeout(resync,1500);
}
/* The live stream can miss a message (sent while a phone was asleep or reconnecting) or deliver
   two near-simultaneous ones in a different order than the relay stored them. The relay's stored
   history is the single source of order: adopt it, then keep any live events it doesn't have yet. */
async function resync(){
  const code=S.code; if(!code) return;
  try{
    const r = await fetch(RELAY+topicPath(code)+"/json?poll=1&since=all");
    if(!r.ok || code!==S.code) return;
    const ids=[], evs=[];
    for(const line of (await r.text()).split(/\r?\n/)){
      if(!line.trim()) continue;
      let m; try{ m=JSON.parse(line); }catch{ continue; }
      const e=parseMsg(m); if(e){ ids.push(m.id); evs.push(e); }
    }
    const have=new Set(ids);
    S.ids.forEach((id,i)=>{ if(!have.has(id)){ ids.push(id); evs.push(S.events[i]); } });
    if(ids.join()!==S.ids.join()){ S.ids=ids; S.events=evs; queueRender(); }
  }catch{}
}
// Light polling keeps phones in step without draining the free relay's per-network rate limit.
setInterval(()=>{ if(!S.code || document.visibilityState!=="visible") return; const s=fold(S.events); if(s.done) return; if(S.conn!=="live" || Math.random()<0.5) resync(); }, 20000);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && S.code){ resync(); if(S.conn==="down") openStream(S.code); } });
let rq=0; function queueRender(){ if(rq) return; rq=setTimeout(()=>{rq=0;render();},0); }

/* ---------------- game state = fold over the event log ---------------- */
function fold(events){
  const s={created:false,host:null,topic:null,day:null,practice:false,players:[],started:false,seats:[],picks:[],orders:{},finished:false};
  for(const e of events){
    const P = s.seats.length;
    const total = 4*P;
    switch(e.type){
      case "create":
        if(!s.created && TOPIC[e.topic]){ s.created=true; s.host=e.pid; s.topic=TOPIC[e.topic]; s.day=e.day|0; s.practice=!!e.practice; }
        break;
      case "join": {
        if(!s.created || typeof e.name!=="string") break;
        const name = e.name.trim().slice(0,18) || "Player";
        const ex = s.players.find(p=>p.pid===e.pid);
        if(ex){ if(!s.started) ex.name=name; }
        else if(!s.started && s.players.length<4) s.players.push({pid:e.pid,name});
        break; }
      case "leave":
        if(!s.started && e.pid!==s.host) s.players = s.players.filter(p=>p.pid!==e.pid);
        break;
      case "start": {
        if(!s.created || s.started || e.pid!==s.host || s.players.length<2) break;
        const ids = s.players.map(p=>p.pid);
        const ord = Array.isArray(e.order) && e.order.length===ids.length && ids.every(i=>e.order.includes(i)) ? e.order : ids;
        s.started=true; s.seats=ord.slice();
        break; }
      case "pick": case "autopick": {
        if(!s.started || e.n!==s.picks.length || s.picks.length>=total) break;
        const who = onClock(s, s.picks.length);
        if(e.type==="pick" && e.pid!==who) break;
        if(e.type==="autopick" && e.pid!==s.host) break;
        if(typeof e.text!=="string" || !key(e.text)) break;
        const ent = matchEntry(s.topic, e.text);
        const pk = ent ? "E"+ent.rank : "W"+key(e.text);
        if(s.picks.some(p=>p.k===pk)) break;
        s.picks.push({pid:who, label: ent?ent.label:titleCase(e.text), rank: ent?ent.rank:null, k:pk, auto:e.type==="autopick"});
        break; }
      case "undo": {
        if(!s.started || !s.picks.length || e.n!==s.picks.length-1 || Object.keys(s.orders).length) break;
        const last = s.picks[s.picks.length-1];
        if(e.pid===last.pid || e.pid===s.host) s.picks.pop();
        break; }
      case "order": {
        if(!s.started || s.finished || s.picks.length<total || s.orders[e.pid] || !s.seats.includes(e.pid)) break;
        const o=e.order; if(Array.isArray(o) && o.length===4 && [0,1,2,3].every(i=>o.includes(i))) s.orders[e.pid]=o.slice();
        break; }
      case "finish":
        if(s.started && s.picks.length>=total && e.pid===s.host) s.finished=true;
        break;
    }
  }
  s.P = s.seats.length; s.total = 4*s.P;
  s.draftDone = s.started && s.picks.length>=s.total;
  s.done = s.draftDone && (s.finished || s.seats.every(p=>s.orders[p]));
  s.name = pid => (s.players.find(p=>p.pid===pid)||{}).name || "Player";
  s.seatIdx = pid => s.seats.indexOf(pid);
  return s;
}
function onClock(s,n){ const P=s.seats.length, r=Math.floor(n/P), pos=n%P; return s.seats[r%2===0?pos:P-1-pos]; }
function picksOf(s,pid){ return s.picks.filter(p=>p.pid===pid); }
function standings(s){
  const rows = s.seats.map(pid=>{
    const picks = picksOf(s,pid), ord = s.orders[pid]||[0,1,2,3];
    const faces = ord.map(i=>picks[i]);
    return {pid, name:s.name(pid), seat:s.seatIdx(pid), faces, ...scoreFaces(faces)};
  }).sort((a,b)=>b.total-a.total);
  let place=0, prev=null;
  rows.forEach((r,i)=>{ if(r.total!==prev){ place=i+1; prev=r.total; } r.place=place; });
  return rows;
}

async function shareOrCopy(text, title, url){
  if(navigator.share){ try{ await navigator.share(url?{title,text,url}:{title,text}); return; }catch(e){ if(e && e.name==="AbortError") return; } }
  const full = url ? text+"\n"+url : text;
  try{ await navigator.clipboard.writeText(full); toast("Copied to clipboard"); }
  catch{ const ta=$("#sharebox"); if(ta){ ta.hidden=false; ta.value=full; ta.select(); toast("Select all and copy"); } }
}

function untilTomorrow(){ const n=new Date(), t=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1); const m=Math.max(0,Math.round((t-n)/6e4)); return `${Math.floor(m/60)}h ${m%60}m`; }
function initials(label){ const w=label.replace(/^the\s+/i,"").split(/[\s-]+/).filter(x=>/[A-Za-z0-9]/.test(x)); return ((w[0]||"?")[0]+(w.length>1?w[w.length-1][0]:(w[0]||"")[1]||"")).toUpperCase(); }

  </svg>`;
}
function brand(){ return `<button class="brand" data-act="home" aria-label="Home"><svg viewBox="0 0 34 22"><path d="M0 22 L8 8 L13 12 L19 2 L26 10 L30 7 L34 14 L34 22Z" fill="var(--rock)"/></svg>Mount Rushmore</button>`; }
function connBadge(){
  if(!S.code) return "";
  const cls = S.conn==="live"?"live":(S.conn==="down"?"bad":"");
  const txt = {live:"live",connecting:"connecting",reconnecting:"reconnecting",down:"offline"}[S.conn]||S.conn;
  return `<span class="conn"><span class="dot ${cls}"></span>${esc(S.code)} · ${txt}</span>`;
}

/* ---------------- views ---------------- */

  <div class="top">${brand()}<span class="conn">#${n}</span></div>
  <div class="stack">
    <section class="hero">

      <div class="copy">

        <div class="meta"><span>${esc(fmtDate())}</span><span>${t.note?esc(t.note)+" · ":""}${t.size}-deep consensus board</span><span>New topic in ${untilTomorrow()}</span></div>

        <div class="seg" role="group" aria-label="Topic">
          <button data-act="htopic" data-v="daily" aria-pressed="${S.homeTopic==="daily"}">Today's</button>
          <button data-act="htopic" data-v="random" aria-pressed="${S.homeTopic==="random"}">Random practice</button>

      <div class="row" style="gap:8px">

        <button class="btn ghost" data-act="joincode">Join</button>
      </div>
      <div class="err" id="homeerr">${esc(S.err)}</div>

function roomView(){
  const s = fold(S.events), me = myPid(S.code);
  document.title = "Mount Rushmore Daily";
  const head = `<div class="top">${brand()}${connBadge()}</div>`;
  if(!s.created){
    const lost = S.conn==="live" && Date.now()-S.openedAt>2500;
    return head+`<div class="card stack"><h2 class="display" style="font-size:24px">${lost?"Room not found":"Opening room…"}</h2>
      <p class="muted" style="margin:0">${lost?"This code doesn't match a game, or the game expired. Rooms last 12 hours.":"Loading picks from the relay."}</p>
      ${lost?`<button class="btn" data-act="home">Back to today's game</button>`:""}</div>`;
  }
  const member = s.players.some(p=>p.pid===me);
  const title = `<div class="stack" style="gap:2px;margin-bottom:14px"><span class="eyebrow">${s.practice?"Practice":"Mount Rushmore #"+s.day}</span><h1 class="display" style="font-size:clamp(28px,7vw,40px)">${esc(s.topic.name)}</h1></div>`;
  if(!s.started) return head+title+lobbyView(s,me,member);
  if(!member && !s.seats.includes(me)) return head+title+spectatorClaim(s)+ (s.done?resultsView(s,me):draftView(s,me,false));
  if(s.done) return head+title+resultsView(s,me);
  if(s.draftDone) return head+title+orderView(s,me);
  return head+title+draftView(s,me,true);
}

function lobbyView(s,me,member){
  const url = roomURL(S.code);
  const slots = [0,1,2,3].map(i=>{
    const p=s.players[i];
    return p ? `<div class="pl"><span class="chip" style="background:${pcol(i)}"></span><span class="n">${esc(p.name)}</span>${p.pid===s.host?`<span class="tag">host</span>`:""}${p.pid===me?`<span class="tag">you</span>`:""}</div>`
             : `<div class="pl empty">Open seat</div>`;
  }).join("");

         <button class="btn gold block" data-act="join" ${S.busy?"disabled":""}>Join game</button><div class="err">${esc(S.err)}</div></div>`) : "";
  const hostCtl = member && me===s.host
      ? `<button class="btn gold block" data-act="start" ${s.players.length<2||S.busy?"disabled":""}>${s.players.length<2?"Waiting for at least 1 friend…":"Start the draft ("+s.players.length+" players)"}</button><div class="err">${esc(S.err)}</div>`
      : member ? `<div class="muted" style="text-align:center">Waiting for ${esc(s.name(s.host))} to start the draft…</div>` : "";
  return `<div class="stack">
    ${joinBox}
    <section class="card stack">
      <span class="eyebrow">Invite friends</span>
      <div class="invite"><span class="code">${esc(S.code)}</span><span class="linkbox" title="${esc(url)}">${esc(url)}</span></div>
      <div class="row"><button class="btn ghost small" data-act="invite">Share invite</button><button class="btn ghost small" data-act="copylink">Copy link</button></div>
      <textarea class="share" id="sharebox" hidden aria-label="Copy this text"></textarea>
    </section>
    <section class="stack" style="gap:8px"><span class="eyebrow">Players · ${s.players.length} of 4</span><div class="plist">${slots}</div></section>
    ${hostCtl}
    <p class="muted" style="font-size:13px;margin:0">Draft order is shuffled when the host starts. Each person plays on their own phone.</p>
  </div>`;
}

function spectatorClaim(s){
  return `<details class="cons" style="margin-bottom:14px"><summary>Are you one of these players? Rejoin on this device</summary>
    <div class="row" style="margin-top:10px">${s.seats.map((p,i)=>`<button class="btn ghost small" data-act="claim" data-pid="${esc(p)}"><span class="chip" style="background:${pcol(i)}"></span>${esc(s.name(p))}</button>`).join("")}</div></details>`;
}

function draftView(s,me,member){
  const n = s.picks.length, over = n>=s.total, who = over?null:onClock(s,n), mine = member && !over && who===me;
  const round = Math.floor(n/s.P)+1;
  const fresh = n > S.lastPickCount ? n-1 : -1; S.lastPickCount = n;
  document.title = mine ? "(Your pick) Mount Rushmore" : "Mount Rushmore Daily";
  if(mine && fresh>=0 && navigator.vibrate){ try{navigator.vibrate(60)}catch{} }
  const upcoming = [];
  for(let i=n;i<Math.min(s.total,n+8);i++){ const p=onClock(s,i); upcoming.push(`<span class="s ${i===n?"now":""}"><span class="chip" style="background:${pcol(s.seatIdx(p))}"></span>${i+1}. ${esc(s.name(p))}${p===me?" (you)":""}</span>`); }
  const cols = s.seats.map((pid,si)=>{
    const ps = picksOf(s,pid);
    const slots=[0,1,2,3].map(i=>{
      const p=ps[i]; if(!p) return `<div class="slot empty"><span class="i">${i+1}</span>—</div>`;
      const gi = s.picks.indexOf(p);
      return `<div class="slot ${gi===fresh?"fresh":""}"><span class="i">${i+1}</span><span class="l">${esc(p.label)}${p.auto?` <span class="tag">auto</span>`:""}</span></div>`;
    }).join("");
    return `<div class="col ${pid===who?"onclock":""}"><h3><span class="chip" style="background:${pcol(si)}"></span><span>${esc(s.name(pid))}${pid===me?" (you)":""}</span></h3>${slots}</div>`;
  }).join("");
  const last = s.picks[n-1];
  const canUndo = member && last && (last.pid===me || me===s.host);
  return `<div class="stack">
    <div class="clock ${mine?"mine":""}">
      <div><div class="eyebrow">${over?"Draft complete":`Round ${round} of 4 · Pick ${n+1} of ${s.total}`}</div>
      <div class="who">${over?"Players are carving their order…":mine?"You're on the clock":esc(s.name(who))+" is picking…"}</div></div>
      ${canUndo?`<button class="btn ghost small" data-act="undo">Undo last pick</button>`:""}
    </div>
    ${mine?`<form class="pickbox stack" id="pickform" style="gap:6px" autocomplete="off">
      <div class="row" style="gap:8px;flex-wrap:nowrap">
        <input class="t" id="pick" placeholder="Name a ${esc(s.topic.name.replace(/s$/,"").toLowerCase())}…" aria-label="Your pick" aria-autocomplete="list" aria-controls="sug" enterkeyhint="done">
        <button class="btn gold" type="submit" ${S.busy?"disabled":""}>Carve</button>
      </div>
      <div class="hint" id="hint"></div>
      <ul class="sug" id="sug" role="listbox"></ul>
      <div class="err">${esc(S.err)}</div>
    </form>`:""}
    ${!over && !mine && member && me===s.host?`<div class="row"><span class="muted" style="font-size:13px">Friend stepped away?</span><button class="btn ghost small" data-act="autopick">Auto-pick for ${esc(s.name(who))}</button></div>`:""}
    <div class="snake" aria-label="Upcoming picks">${upcoming.join("")}</div>
    <div class="board" style="--cols:${s.P}">${cols}</div>
  </div>`;
}

function orderView(s,me){
  const picks = picksOf(s,me);
  const locked = s.orders[me];
  if(!S.myOrder || S.myOrder.length!==4) S.myOrder=[0,1,2,3];
  const status = s.seats.map((p,i)=>`<div class="pl"><span class="chip" style="background:${pcol(i)}"></span><span class="n">${esc(s.name(p))}</span><span class="tag">${s.orders[p]?"locked":"ordering"}</span></div>`).join("");
  const body = locked
    ? `<div class="card"><b>Your mountain is locked.</b> <span class="muted">Waiting on the others.</span></div>`
    : `<section class="stack" style="gap:10px"><div><h2 class="display" style="font-size:22px">Carve your order</h2><p class="muted" style="margin:4px 0 0;font-size:14px">Put your best face in the Washington spot. Slots are scored against the consensus order.</p></div>
      <ol class="olist">${S.myOrder.map((pi,slot)=>`<li><span class="spot">#${slot+1}<br>${SPOTS[slot]}</span><span class="nm">${esc(picks[pi].label)}</span>
        <span class="arrows"><button data-act="up" data-i="${slot}" ${slot===0?"disabled":""} aria-label="Move up">&uarr;</button><button data-act="down" data-i="${slot}" ${slot===3?"disabled":""} aria-label="Move down">&darr;</button></span></li>`).join("")}</ol>
      <button class="btn gold block" data-act="lock" ${S.busy?"disabled":""}>Lock in my mountain</button><div class="err">${esc(S.err)}</div></section>`;
  return `<div class="stack">${body}
    <section class="stack" style="gap:8px"><span class="eyebrow">Draft complete</span><div class="plist">${status}</div></section>
    ${me===s.host?`<button class="btn ghost small" data-act="finish" style="align-self:flex-start">Score it now (unlocked players keep draft order)</button>`:""}
  </div>`;
}

function resultsView(s,me){
  const rows = standings(s);
  saveRecent(s,rows);
  const top = rows.filter(r=>r.place===1);
  const medal = p => ["","1st","2nd","3rd","4th"][p];
  const cards = rows.map(r=>`
    <article class="rcard">
      <div class="head"><h3><span class="chip" style="background:${pcol(r.seat)}"></span><span>${esc(r.name)}${r.pid===me?" (you)":""}</span></h3>
        <div style="text-align:right"><div class="place">${medal(r.place)}</div><div class="total">${r.total}<small> /482</small></div></div></div>
      ${mountain(r.faces.map(f=>initials(f.label)), pcol(r.seat))}
      <table class="faces"><tbody>${r.rows.map(x=>`<tr>
        <td><div class="fn"><span class="tier" style="background:var(--t${tierOf(x.f.rank)})"></span>${x.slot+1}. ${esc(x.f.label)}</div>
          <div class="sub">${x.f.rank?"Consensus #"+x.f.rank:"Write-in"}${x.right?`<span class="bonus">+10 right slot</span>`:""}${x.exact?`<span class="bonus">+15 exact spot</span>`:""}</div></td>
        <td class="pts">${x.pts}</td></tr>`).join("")}</tbody></table>
    </article>`).join("");
  return `<div class="stack">
    <section class="winner card"><div class="eyebrow">${top.length>1?"It's a tie":"Tallest mountain"}</div>
      <div class="display">${top.map(r=>esc(r.name)).join(" &amp; ")}</div>
      <div class="muted mono" style="margin-top:4px">${top[0].total} points</div>
      <div class="row" style="justify-content:center;margin-top:14px"><button class="btn gold" data-act="shareres">Share results</button><button class="btn ghost" data-act="home">Today's game</button></div>
      <textarea class="share" id="sharebox" hidden aria-label="Copy these results" style="margin-top:12px"></textarea>
    </section>
    <div class="legend">${[1,2,3,4].map(t=>`<span><span class="tier" style="background:var(--t${t})"></span>${TIER_TXT[t]}</span>`).join("")}</div>
    <div class="res">${cards}</div>
    <details class="cons"><summary>Reveal the consensus top 10</summary><ol>${s.topic.entries.slice(0,10).map(e=>`<li>${esc(e.label)}</li>`).join("")}</ol></details>
  </div>`;
}
function shareText(s){
  const rows = standings(s), m=["","\u{1F947}","\u{1F948}","\u{1F949}","4️⃣"];
  const lines = [`\u{1F5FB} Mount Rushmore ${s.practice?"(practice)":"#"+s.day} · ${s.topic.name}`, ""];
  for(const r of rows){
    lines.push(`${m[r.place]} ${r.name} — ${r.total}`);
    lines.push(`${r.faces.map(f=>TIER_EMO[tierOf(f.rank)]).join("")} ${r.faces.map(f=>f.label).join(", ")}`);
  }
  return lines.join("\n");
}
function saveRecent(s,rows){
  const list = store.get("mr.recent",[]);
  if(list.some(x=>x.code===S.code)) return;
  list.unshift({code:S.code, day:s.day, topic:s.topic.name, line: rows.map(r=>r.name+" "+r.total).join(", ")});
  store.set("mr.recent", list.slice(0,20));
}

/* ---------------- suggestions ---------------- */
function taken(s){ return new Set(s.picks.map(p=>p.k)); }
function updateSuggest(){
  const inp=$("#pick"); if(!inp) return;
  const s=fold(S.events), tk=taken(s), txt=inp.value, k=key(txt);
  const sug=$("#sug"), hint=$("#hint");
  S.draft = txt;
  if(!k){ sug.innerHTML=""; hint.innerHTML=""; return; }
  const list = s.topic.entries.filter(e=>!tk.has("E"+e.rank) && (e.keys.some(x=>x.includes(k)) || key(e.label).split(" ").some(w=>w.startsWith(k))))
    .sort((a,b)=>a.label.localeCompare(b.label)).slice(0,6);
  if(S.sugIdx>=list.length) S.sugIdx=0;
  sug.innerHTML = list.map((e,i)=>`<li><button type="button" role="option" data-act="sug" data-label="${esc(e.label)}" aria-selected="${i===S.sugIdx}">${esc(e.label)}</button></li>`).join("");
  const m = matchEntry(s.topic, txt);
  const dup = m ? tk.has("E"+m.rank) : tk.has("W"+k);
  hint.innerHTML = dup ? `<span class="err">Already drafted.</span>` : m ? `Matches <b>${esc(m.label)}</b>` : list.length ? `Tap a suggestion, or keep typing` : `Not on the board: counts as a write-in (${WRITE_IN} pts)`;
}

/* ---------------- actions ---------------- */
async function act(fn){ if(S.busy) return; S.busy=true; S.err=""; render(); try{ await fn(); }catch(e){ S.err=e.message||String(e); } S.busy=false; render(); }
function goRoom(code){ history.pushState(null,"","?r="+code+(SEAT?"&seat="+SEAT:"")); connect(code); render(); }
function goHome(){ if(S.es) S.es.close(); S.es=null; S.code=null; S.err=""; history.pushState(null,"",location.pathname+(SEAT?"?seat="+SEAT:"")); document.title="Mount Rushmore Daily"; render(); }

async function doCreate(){
  const name=($("#name").value||"").trim();
  if(!name){ S.err="Add your name so friends know who's drafting."; render(); $("#name")?.focus(); return; }
  store.set("mr.name",name);
  const day=dayNumber();
  let t = topicForDay(day), practice=false;
  if(S.homeTopic==="random"){ practice=true; const others=TOPICS.filter(x=>x!==t); t=others[Math.floor(Math.random()*others.length)]; }
  const code=roomCode();
  goRoom(code);
  await act(async()=>{ await send({type:"create",topic:t.id,day,practice}); await send({type:"join",name}); });
}
async function doPick(text){
  const s=fold(S.events); const me=myPid(S.code);
  text=(text||"").trim(); if(!key(text)) return;
  const m=matchEntry(s.topic,text), pk=m?"E"+m.rank:"W"+key(text);
  if(taken(s).has(pk)){ S.err=(m?m.label:titleCase(text))+" is already drafted."; render(); return; }
  if(onClock(s,s.picks.length)!==me) return;
  const n=s.picks.length;
  await act(async()=>{ await send({type:"pick",n,text:m?m.label:text}); S.draft=""; S.sugIdx=0; S.confirmWrite=null; const inp=$("#pick"); if(inp) inp.value=""; });
}

document.addEventListener("click", e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(a==="home") return goHome();
  if(a==="htopic"){ S.homeTopic=b.dataset.v; render(); return; }
  if(a==="create") return doCreate();
  if(a==="joincode"){ const c=($("#joincode").value||"").toUpperCase().replace(/[^A-Z0-9]/g,""); if(c.length!==6){ S.err="Codes are 6 characters."; render(); return;} return goRoom(c); }
  if(!S.code) return;
  const s=fold(S.events), me=myPid(S.code);
  if(a==="join"){ const nm=($("#jname").value||"").trim(); if(!nm){S.err="Add your name first."; render(); return;} store.set("mr.name",nm); return act(()=>send({type:"join",name:nm})); }
  if(a==="start"){ const ids=s.players.map(p=>p.pid); for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]} return act(()=>send({type:"start",order:ids})); }
  if(a==="invite") return shareOrCopy(`Draft your Mount Rushmore of ${s.topic.name} with me. Room code ${S.code}`, "Mount Rushmore", roomURL(S.code));
  if(a==="copylink"){ navigator.clipboard.writeText(roomURL(S.code)).then(()=>toast("Link copied"),()=>{const ta=$("#sharebox"); ta.hidden=false; ta.value=roomURL(S.code); ta.select();}); return; }
  if(a==="sug") return doPick(b.dataset.label);
  if(a==="undo") return act(()=>send({type:"undo",n:s.picks.length-1}));
  if(a==="autopick"){ const tk=taken(s); const best=s.topic.entries.find(x=>!tk.has("E"+x.rank)); if(best) return act(()=>send({type:"autopick",n:s.picks.length,text:best.label})); return; }
  if(a==="up"||a==="down"){ const i=+b.dataset.i, j=a==="up"?i-1:i+1; const o=S.myOrder; [o[i],o[j]]=[o[j],o[i]]; render(); return; }
  if(a==="lock") return act(()=>send({type:"order",order:S.myOrder.slice()}));
  if(a==="finish") return act(()=>send({type:"finish"}));
  if(a==="claim"){ setPid(S.code,b.dataset.pid); render(); toast("Rejoined as "+s.name(b.dataset.pid)); return; }
  if(a==="shareres") return shareOrCopy(shareText(s),"Mount Rushmore", roomURL(S.code));
});
document.addEventListener("submit", e=>{
  if(e.target.id==="pickform"){ e.preventDefault(); const opts=[...document.querySelectorAll("#sug [data-label]")]; const inp=$("#pick");
    const m = fold(S.events); const exact = matchEntry(m.topic, inp.value);
    if(!exact && opts.length && S.sugNav) return doPick(opts[S.sugIdx].dataset.label);
    // Not on the board but close to something that is: make the write-in a deliberate second tap.
    if(!exact && opts.length && S.confirmWrite!==key(inp.value)){ S.confirmWrite=key(inp.value); $("#hint").innerHTML=`Tap a suggestion, or press <b>Carve</b> again to write in "${esc(titleCase(inp.value))}" (${WRITE_IN} pts)`; return; }
    doPick(inp.value); }
});
document.addEventListener("input", e=>{ if(e.target.id==="pick"){ S.sugIdx=0; S.sugNav=false; S.err=""; updateSuggest(); } if(e.target.id==="name"||e.target.id==="joincode") S.err=""; });
document.addEventListener("keydown", e=>{
  if(e.target.id==="pick" && (e.key==="ArrowDown"||e.key==="ArrowUp")){
    const n=document.querySelectorAll("#sug [data-label]").length; if(!n) return; e.preventDefault(); S.sugNav=true;
    S.sugIdx=(S.sugIdx+(e.key==="ArrowDown"?1:-1)+n)%n; updateSuggest();
  }
  if(e.target.id==="joincode" && e.key==="Enter"){ e.preventDefault(); $('[data-act="joincode"]').click(); }
  if(e.target.id==="name" && e.key==="Enter"){ e.preventDefault(); doCreate(); }
  if(e.target.id==="jname" && e.key==="Enter"){ e.preventDefault(); $('[data-act="join"]')?.click(); }
});
window.addEventListener("popstate", ()=>boot());

/* ---------------- render ---------------- */
function render(){
  const app=$("#app");
  // Keep whatever someone is typing (text, focus, cursor) across redraws triggered by other players.
  const keep={}; let focusId=null, a=0, b=0;
  for(const el of app.querySelectorAll("input[id]")) keep[el.id]=el.value;
  const act=document.activeElement;
  if(act && act.tagName==="INPUT" && act.id){ focusId=act.id; try{ a=act.selectionStart; b=act.selectionEnd; }catch{} }
  if("pick" in keep) S.draft=keep.pick;
  app.innerHTML = S.code ? roomView() : homeView();
  for(const [id,v] of Object.entries(keep)){ const el=document.getElementById(id); if(el) el.value=v; }
  const ni=$("#pick"); if(ni){ ni.value=S.draft; updateSuggest(); }
  const f=focusId && document.getElementById(focusId);
  if(f){ f.focus(); try{ f.setSelectionRange(a,b); }catch{} }
}
function boot(){
  const code=(new URLSearchParams(location.search).get("r")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(code.length===6){ if(code!==S.code) connect(code); }
  else { if(S.es) S.es.close(); S.es=null; S.code=null; }
  render();
}
boot();
setInterval(()=>{ if(!S.code && !(document.activeElement && document.activeElement.tagName==="INPUT")) render(); }, 60000);
</script>
